server {
    listen 5003;
    server_name _;

    client_max_body_size 200m;

    root /usr/share/nginx/xuanlan;
    # 统一控制台（全部功能原生实现，无 iframe 融合）
    index console.html;

    location /api/ {
        proxy_pass http://web:5013;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 旧独立页 301 → 统一控制台（P2 合并，保留老书签）
    location = /report.html       { return 301 "/console.html#/reports"; }
    location = /engine_graph.html { return 301 "/console.html#/engines"; }
    location = /session_pool.html { return 301 "/console.html#/sessions"; }
    location = /appdl.html        { return 301 "/console.html#/enterprise"; }

    location / {
        try_files $uri $uri/ =404;
    }
}
