<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>玄览控制台</title>
<link rel="stylesheet" href="/vendor/open-props.min.css"/>
<script src="/vendor/gsap.min.js"></script>
<style>
/* 自托管开源字体（@fontsource/Inter、@fontsource/JetBrains Mono，OFL 许可） */
@font-face{
  font-family:"Inter Variable";font-style:normal;font-weight:100 900;font-display:swap;
  src:url("/fonts/inter-var.woff2") format("woff2");
}
@font-face{
  font-family:"JetBrains Mono Variable";font-style:normal;font-weight:100 800;font-display:swap;
  src:url("/fonts/jetbrains-mono-var.woff2") format("woff2");
}
:root{
  /* GitHub Primer Dark 配色 */
  --bg:#0d1117; --panel:#161b22; --panel2:#21262d; --line:#30363d; --line2:#3d444d;
  --fg:#e6edf3; --dim:#8b949e; --dim2:#6e7681;
  --acc:#4493f8; --acc2:#1f6feb; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter Variable",-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);font-size:14px;line-height:1.5;
     font-feature-settings:"cv05" 1,"ss01" 1;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--fg);
  border-radius:6px;padding:0 12px;height:30px;font-size:13px;outline:none;
  transition:border-color var(--speed-2,.15s) var(--ease-2,cubic-bezier(.25,.1,.25,1)),
             box-shadow var(--speed-2,.15s) var(--ease-2,cubic-bezier(.25,.1,.25,1))}
textarea{height:auto;padding:8px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);
  box-shadow:0 0 0 3px rgba(68,147,248,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
     height:30px;padding:0 14px;background:var(--panel2);
     border:1px solid rgba(240,246,252,.1);color:var(--fg);border-radius:6px;
     font-size:13px;font-weight:500;letter-spacing:.1px;cursor:pointer;
     transition:background var(--speed-2,.15s) var(--ease-2,cubic-bezier(.25,.1,.25,1)),
                border-color var(--speed-2,.15s) var(--ease-2,cubic-bezier(.25,.1,.25,1)),
                transform var(--speed-1,.1s) var(--ease-2,cubic-bezier(.25,.1,.25,1))}
.btn:hover{background:#262c36;border-color:#8b949e;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc2);border-color:rgba(240,246,252,.1);color:#fff}
.btn.primary:hover{background:#388bfd}
.btn.danger{color:var(--bad);border-color:rgba(240,246,252,.1)}
.btn.danger:hover{border-color:var(--bad);background:#262c36}
.btn.sm{height:26px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
/* 登录 */
#login{display:flex;align-items:center;justify-content:center;height:100vh;
       background:radial-gradient(1200px 600px at 50% -10%,#12233d,var(--bg))}
#login .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
             padding:36px 40px;width:340px}
#login h1{font-size:18px;margin-bottom:24px;letter-spacing:2px;font-weight:600}
#login input{width:100%;margin-bottom:14px;padding:7px 12px}
#login button{width:100%;padding:7px}
/* 布局 */
#app{display:flex;min-height:100vh}
aside{width:212px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
      padding:14px 10px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
aside .logo{font-size:14px;letter-spacing:2px;padding:6px 10px 14px;font-weight:600}
aside .group{font-size:11px;color:var(--dim2);padding:16px 10px 5px;letter-spacing:3px;
             pointer-events:none;user-select:none;line-height:1;font-weight:500}
aside nav a{display:block;padding:5px 10px;margin:1px 0;color:var(--fg);font-size:13.5px;
            border-radius:6px;text-decoration:none;transition:background .12s}
aside nav a:hover{background:var(--panel2);text-decoration:none}
aside nav a.active{background:var(--acc2);color:#fff;font-weight:500}
aside .me{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
aside .me .role{color:var(--warn)}
aside .me button{margin-top:8px;width:100%}
main{flex:1;padding:22px 28px 60px;min-width:0}
h2.page{font-size:19px;font-weight:600;margin-bottom:14px;padding-bottom:10px;
        border-bottom:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.spacer{margin-left:auto}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
/* 表格 */
.tblwrap{background:var(--panel);border:1px solid var(--line);border-radius:6px;
         overflow:auto;max-height:calc(100vh - 230px)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--dim);text-align:left;padding:8px 14px;font-weight:500;
   border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);white-space:nowrap}
th.sortable{cursor:pointer} th.sortable:hover{color:var(--acc)}
td{padding:7px 14px;border-bottom:1px solid #21262d;font-size:13px;vertical-align:top}
tr:hover td{background:#1c2128}
.mono{font-family:"JetBrains Mono Variable",var(--mono);font-size:13px}
.dim{color:var(--dim)} .dim2{color:var(--dim2)}
/* 卡片 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)} .g6{grid-template-columns:repeat(6,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.stat .v{font-size:22px;font-weight:600;font-family:var(--mono)}
.stat .k{font-size:13px;color:var(--dim);margin-top:2px}
.stat .d{font-size:13px;margin-top:3px}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--dim)}
/* 徽章 */
.badge{border-radius:10px;padding:1px 9px;font-size:12px;display:inline-block;font-weight:500}
.b-ok{background:#12261e;color:var(--ok)} .b-bad{background:#25171c;color:var(--bad)}
.b-warn{background:#242214;color:var(--warn)} .b-dim{background:#1c2128;color:var(--dim)}
.b-info{background:#121d2f;color:var(--acc)}
.sev-critical,.sev-high{color:var(--bad)} .sev-medium{color:var(--warn)} .sev-low{color:var(--ok)}
/* 分页 */
.pager{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dim);margin-top:10px}
.pager .btn.sm{padding:3px 10px}
/* 抽屉 */
#drawer{position:fixed;right:0;top:0;bottom:0;width:520px;max-width:94vw;background:var(--panel);
        border-left:1px solid var(--line);padding:22px;overflow-y:auto;z-index:60;
        box-shadow:-12px 0 32px rgba(1,4,9,.6);
        transform:translateX(100%)}
#drawer.open{transform:none}
#drawer h3{font-size:15px;margin-bottom:14px;font-weight:600}
#drawer .close{float:right;cursor:pointer;color:var(--dim);font-size:18px}
#drawer .close:hover{color:var(--fg)}
#drawer h4{font-size:12px;color:var(--dim);margin:16px 0 6px;font-weight:500;letter-spacing:1px}
.dl{font-size:13px;line-height:2}
.dl b{color:var(--dim);font-weight:500;display:inline-block;width:92px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:1px 10px;font-size:12px}
.chip a{color:var(--dim);margin-left:5px}
.chip a:hover{color:var(--bad)}
/* 阶段时间线 */
.tl{border-left:2px solid var(--line);margin-left:8px;padding-left:16px}
.tl .item{position:relative;padding:4px 0;font-size:13px}
.tl .item::before{content:"";position:absolute;left:-22px;top:12px;width:8px;height:8px;
                  border-radius:50%;background:var(--dim2)}
.tl .item.done::before{background:var(--ok)}
.tl .item.error::before{background:var(--bad)}
.tl .item.doing::before{background:var(--acc)}
/* 图表 */
.legend{display:flex;gap:14px;font-size:13px;color:var(--dim);margin:6px 0 10px;flex-wrap:wrap}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.bar-row{display:flex;align-items:center;gap:10px;font-size:13px;margin:5px 0}
.bar-row .name{width:150px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bar{flex:1;height:14px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar-row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:4px}
.bar-row .num{width:56px;text-align:right;font-family:var(--mono);font-size:13px}
/* 表单 */
.frm{margin:4px 0}
.frm label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--fg);padding:3px 0;cursor:pointer}
.frm .col{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
/* AI 助手悬浮窗与会话页 */
#ai-fab{position:fixed;right:22px;bottom:22px;z-index:70;height:38px;padding:0 16px;
        border-radius:19px;background:var(--acc2);color:#fff;border:0;cursor:pointer;
        font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(31,111,235,.45)}
#ai-fab:hover{background:#388bfd}
#ai-panel{position:fixed;right:22px;bottom:68px;width:400px;height:540px;max-height:82vh;
          background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:70;
          display:none;flex-direction:column;box-shadow:0 16px 48px rgba(1,4,9,.6);overflow:hidden}
#ai-panel.open{display:flex}
.ai-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ai-msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:88%;padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.ai-msg.user{align-self:flex-end;background:var(--acc2);color:#fff}
.ai-msg.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.ai-msg .tool-step{font-size:12px;color:var(--dim);border-left:2px solid var(--acc);padding:2px 0 2px 8px;margin:4px 0}
.ai-msg .tool-step b{color:var(--acc);font-weight:500}
.ai-input{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.ai-input textarea{flex:1;height:44px;resize:none}
.ai-conv-item{display:block;padding:7px 12px;border-radius:6px;color:var(--fg);cursor:pointer;font-size:13px;
              overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-conv-item:hover{background:var(--panel2)}
.ai-conv-item.active{background:var(--panel2);border-left:2px solid var(--acc)}
/* 会话窗口登录弹窗 */
#win-modal{position:fixed;inset:0;background:rgba(1,4,9,.72);z-index:80;display:none;
           align-items:center;justify-content:center}
#win-modal .box{width:92vw;height:88vh;background:var(--panel);border:1px solid var(--line);
                border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.win-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
#win-iframe{flex:1;border:0;background:#0d1117}
/* 其他 */
.empty{color:var(--dim2);text-align:center;padding:46px 0}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--panel2);
       border:1px solid var(--line);color:var(--fg);font-size:13px;border-radius:6px;
       padding:10px 20px;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 8px 24px rgba(1,4,9,.5)}
#toast.show{opacity:1}
.chipbtn{cursor:pointer}
.chk{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--dim)}
</style>
</head>
<body>

<div id="login" style="display:none">
  <div class="card">
    <h1>玄览控制台</h1>
    <input type="text" id="li-user" placeholder="用户名" autocomplete="username"/>
    <input type="password" id="li-pass" placeholder="密码" autocomplete="current-password"/>
    <button class="btn primary" onclick="doLogin()">登 录</button>
  </div>
</div>

<div id="app" style="display:none">
  <aside>
    <div class="logo">玄览控制台</div>
    <div class="group">总览</div>
    <nav><a href="#/overview">看板</a></nav>
    <div class="group">资产</div>
    <nav>
      <a href="#/assets">资产检索</a>
      <a href="#/scopes">资产组</a>
      <a href="#/enterprise">企业情报</a>
    </nav>
    <div class="group">任务</div>
    <nav>
      <a href="#/tasks">任务管理</a>
      <a href="#/policy">任务策略</a>
      <a href="#/schedules">计划任务</a>
    </nav>
    <div class="group">监控</div>
    <nav>
      <a href="#/diff">变化历史</a>
      <a href="#/reports">报告中心</a>
    </nav>
    <div class="group">风险</div>
    <nav><a href="#/risks">风险中心</a></nav>
    <div class="group">引擎</div>
    <nav>
      <a href="#/engines">扫描引擎</a>
      <a href="#/fingerprints">指纹库</a>
      <a href="#/poc">POC 库</a>
    </nav>
    <div class="group">数据源</div>
    <nav>
      <a href="#/sessions">会话池</a>
      <a href="#/sources">API 接入</a>
    </nav>
    <div class="group">智能</div>
    <nav><a href="#/assistant">智能助手</a></nav>
    <div class="group">系统</div>
    <nav>
      <a href="#/settings">通知设置</a>
      <a href="#/ai">AI 配置</a>
      <a href="#/users" id="nav-users" style="display:none">用户管理</a>
    </nav>
    <div class="me">
      <div id="me-name">—</div>
      <div>角色 <span class="role" id="me-role">—</span></div>
      <button class="btn" onclick="logout()">退出登录</button>
    </div>
  </aside>
  <main id="view"></main>
</div>

<div id="drawer"><span class="close" onclick="closeDrawer()">✕</span><div id="drawer-body"></div></div>
<div id="toast"></div>

<button id="ai-fab" onclick="aiToggle()">智能助手</button>
<div id="ai-panel">
  <div class="ai-head"><b style="font-size:14px">玄览智能助手</b>
    <span class="dim2" style="font-size:12px" id="ai-conv-title-float">新会话</span>
    <span class="spacer"></span>
    <button class="btn sm" onclick="agNew()">新会话</button>
    <button class="btn sm" onclick="aiToggle()">收起</button></div>
  <div class="ai-msgs" id="ai-msgs-float"><div class="dim2" style="margin:auto">布置任务给助手——它可以直接调用平台功能（检索资产/下发任务/查风险/生成报告…）</div></div>
  <div class="ai-input">
    <textarea id="ai-input-float" placeholder="如：看看 example.com 的风险并生成报告"
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();agSend('float')}"></textarea>
    <button class="btn primary" onclick="agSend('float')">发送</button></div>
</div>

<div id="win-modal">
  <div class="box">
    <div class="win-head"><b id="win-title">窗口登录</b>
      <span class="dim2" style="font-size:12px">在右侧浏览器中完成登录，登录成功后点「完成并抓取」</span>
      <span class="spacer"></span>
      <button class="btn primary" id="win-capture-btn" onclick="spCapture()">完成并抓取</button>
      <button class="btn" onclick="spCloseWindow()">关闭窗口</button></div>
    <iframe id="win-iframe" allow="clipboard-read; clipboard-write"></iframe>
  </div>
</div>

<script>
/* ============================ 基础 ============================ */
const $ = s => document.querySelector(s);
const API = "/api";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg){
  const el=$("#toast"); el.textContent=msg;
  if (window.gsap){
    gsap.killTweensOf(el);
    el.classList.add("show");
    gsap.fromTo(el,{y:10,opacity:0,scale:.96},
      {y:0,opacity:1,scale:1,duration:.3,ease:"back.out(1.6)"});
    gsap.to(el,{opacity:0,y:6,duration:.25,delay:2.5,ease:"power2.in",
      onComplete:()=>el.classList.remove("show")});
  } else {
    el.classList.add("show");
    setTimeout(()=>el.classList.remove("show"),2800);
  }
}
function token(){ return localStorage.getItem("token") || ""; }
function myRole(){ return localStorage.getItem("role") || "admin"; }
function myUser(){ return localStorage.getItem("user") || ""; }
async function api(path, opts={}){
  opts.headers = Object.assign({"Token": token()}, opts.headers||{});
  if (opts.json){ opts.headers["Content-Type"]="application/json";
                  opts.body = JSON.stringify(opts.json); delete opts.json; }
  const r = await fetch(API+path, opts);
  let body = {}; try{ body = await r.json(); }catch(e){}
  if (body.code === 401){ showLogin(); throw new Error("未登录"); }
  return body;
}
async function fetchRaw(path){
  const r = await fetch(API+path, {headers:{"Token": token()}});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r;
}
/* GSAP 初始态归一化：把 CSS 起始位移(translateX(100%))的像素解析清零，
   此后抽屉统一由 xPercent 驱动，避免 px+xPercent 叠加导致卡位 */
if (window.gsap) gsap.set("#drawer", {x:0, xPercent:100});

function openDrawer(html){ $("#drawer-body").innerHTML = html;
  $("#drawer").classList.add("open");
  if (window.gsap) gsap.to("#drawer", {xPercent:0, duration:.34, ease:"power3.out",
    overwrite:true});
  else $("#drawer").style.transform = "none"; }
function closeDrawer(){
  if (window.gsap){
    gsap.to("#drawer", {xPercent:100, duration:.26, ease:"power3.in",
      onComplete:()=>$("#drawer").classList.remove("open")});
  } else $("#drawer").classList.remove("open"); }
/* 取列表数据（兼容三种返回形态：data.items / 顶层 items / data 为数组） */
function pickList(body){
  const d = body && body.data ? body.data : body;
  if (Array.isArray(d)) return {items: d, total: d.length};
  if (!d) return {items: [], total: 0};
  const items = d.items || d.rows || [];
  return {items, total: (d.total != null ? d.total : items.length)};
}
function idTs(id){ try{ return parseInt(String(id).slice(0,8),16)*1000; }catch(e){ return 0; } }
function csvDownload(filename, headers, rows){
  const escCell = v => '"' + String(v ?? "").replace(/"/g,'""') + '"';
  const lines = [headers.map(escCell).join(",")].concat(
    rows.map(r => r.map(escCell).join(",")));
  const blob = new Blob(["\ufeff" + lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}
function fmtInterval(sec){
  if (sec == null || sec === "") return "—";
  if (sec % 86400 === 0) return (sec/86400) + " 天";
  if (sec % 3600 === 0) return (sec/3600) + " 小时";
  return sec + " 秒";
}
function jobBadge(st){
  const s = String(st||"").toLowerCase();
  if (s === "running" || s === "scheduled") return '<span class="badge b-ok">'+esc(st)+'</span>';
  if (s === "stop" || s === "stopped") return '<span class="badge b-dim">'+esc(st)+'</span>';
  return '<span class="badge b-info">'+esc(st||"—")+'</span>';
}
/* 表格客户端排序（当前页） */
let sortState = {};
function sortedRows(rows, tableKey){
  const st = sortState[tableKey];
  if (!st) return rows;
  const sorted = [...rows].sort((a,b)=>{
    const av = String(a[st.col] ?? ""), bv = String(b[st.col] ?? "");
    return st.dir * av.localeCompare(bv, undefined, {numeric:true});
  });
  return sorted;
}
function sortIcon(tableKey, col){
  const st = sortState[tableKey];
  if (!st || st.col !== col) return "";
  return st.dir > 0 ? " ▲" : " ▼";
}
function pagerHtml(tableKey, page, size, total){
  const pages = Math.max(1, Math.ceil(total / size));
  return `<div class="pager">
    <button class="btn sm" ${page<=1?"disabled":""} onclick="goPage('${tableKey}',${page-1})">上一页</button>
    第 ${page} / ${pages} 页 · 共 ${total} 条
    <button class="btn sm" ${page>=pages?"disabled":""} onclick="goPage('${tableKey}',${page+1})">下一页</button>
    <span class="spacer"></span>
  </div>`;
}
/* 分页统一跳转入口（pagerHtml 生成的 goPage 调用按表路由） */
const PAGE_LOADERS = {
  asset: p => loadAssets(p),
  tk:    p => { taskPage = p; loadTasks(); },
  risk:  p => { riskPage = p; fetchRisks(); },
  poc:   p => { pocPage = p; loadPoc(); },
};
function goPage(key, page){
  const fn = PAGE_LOADERS[key];
  if (fn) fn(page);
}

/* ============================ 登录 ============================ */
function showLogin(){ $("#login").style.display="flex"; $("#app").style.display="none"; }
async function doLogin(){
  const r = await fetch(API+"/user/login",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:$("#li-user").value.trim(),
                         password:$("#li-pass").value})});
  const body = await r.json();
  if (body.code !== 200){ toast(body.message || "登录失败"); return; }
  localStorage.setItem("token", body.data.token);
  localStorage.setItem("role", body.data.role || "admin");
  localStorage.setItem("user", body.data.username);
  boot();
}
function logout(){
  fetch(API+"/user/logout",{method:"POST",headers:{"Token":token()}});
  localStorage.clear(); showLogin();
}

/* ============================ 路由 ============================ */
const ROUTES = {};
function nav(){
  const view = (location.hash || "#/overview").replace("#/","").split("?")[0];
  document.querySelectorAll("aside nav a").forEach(a=>
    a.classList.toggle("active", a.getAttribute("href") === "#/"+view));
  $("#me-name").textContent = myUser();
  $("#me-role").textContent = myRole();
  $("#nav-users").style.display = myRole()==="admin" ? "" : "none";
  (ROUTES[view] || ROUTES.overview)();
}
window.addEventListener("hashchange", ()=>{ if(token()) nav(); });
function go(hash){ location.hash = hash; }

/* 页面切换动效（GSAP）：#view 内容变更后轻微上移淡入（去抖合并渐进渲染） */
let _viewTweenTimer = null;
const _viewObserver = new MutationObserver(()=>{
  if (!window.gsap) return;
  clearTimeout(_viewTweenTimer);
  _viewTweenTimer = setTimeout(()=>{
    gsap.fromTo("#view", {opacity:0, y:10},
      {opacity:1, y:0, duration:.32, ease:"power2.out", overwrite:true});
  }, 60);
});

function boot(){
  if (!token()){ showLogin(); return; }
  $("#login").style.display="none"; $("#app").style.display="flex";
  if (window.gsap) gsap.fromTo("#app", {opacity:0}, {opacity:1, duration:.4, ease:"power2.out"});
  _viewObserver.observe($("#view"), {childList:true});
  nav();
}

/* ============================ 看板 ============================ */
let trendChart = null;
ROUTES.overview = async function(){
  $("#view").innerHTML = "<h2 class='page'>看板</h2><div class='empty'>加载中…</div>";
  const [statsB, taskB, vulnB, ipB, siteB] = await Promise.all([
    api("/stats/summary/"),
    api("/task/?size=1000"),
    api("/vuln/?size=1000"),
    api("/ip/?size=500"),
    api("/site/?size=500"),
  ]);
  const s = statsB.data || {};
  const h = s.health || {};
  const tr = h.tasks_recent || {};
  const rate = tr.success_rate != null ? (tr.success_rate*100).toFixed(1)+"%" : "—";
  const feng = h.fengniao_token || {};
  const fengLeft = feng.expires_in_hours != null ? feng.expires_in_hours.toFixed(1)+"h" : "—";
  const fengBadge = !feng.configured ? '<span class="badge b-dim">未配置</span>'
    : (feng.expires_in_hours != null && feng.expires_in_hours < 24
       ? '<span class="badge b-bad">即将过期</span>' : '<span class="badge b-ok">正常</span>');
  const stat = (v,k,d)=>`<div class="card stat"><div class="v">${v}</div><div class="k">${k}</div><div class="d">${d||""}</div></div>`;

  /* 近 14 天任务提交趋势（ObjectId 时间戳） */
  const tasks = pickList(taskB).items;
  const days = [];
  for (let i=13;i>=0;i--){
    const d = new Date(Date.now()-i*86400000);
    days.push(d.toISOString().slice(5,10));
  }
  const perDay = days.map(()=>0);
  tasks.forEach(t=>{
    const d = new Date(idTs(t._id)).toISOString().slice(5,10);
    const idx = days.indexOf(d);
    if (idx >= 0) perDay[idx] += 1;
  });
  const maxT = Math.max(1, ...perDay);

  /* 漏洞严重度 donut（优先 health 权威聚合，缺失时用样本计数） */
  const vulns = pickList(vulnB).items;
  let sevCount = null;
  if (h.vuln_by_severity) sevCount = h.vuln_by_severity;
  else {
    sevCount = {critical:0, high:0, medium:0, low:0};
    vulns.forEach(v=>{
      const key = String(v.severity||"").toLowerCase();
      if (key in sevCount) sevCount[key] += 1;
    });
  }

  /* Top 端口 / 指纹 */
  const ips = pickList(ipB).items;
  const portCount = {};
  ips.forEach(i=> (i.port_info||[]).forEach(p=>{
    const pid = p.port_id; portCount[pid] = (portCount[pid]||0)+1;
  }));
  const topPorts = Object.entries(portCount).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const sites = pickList(siteB).items;
  const fingerCount = {};
  sites.forEach(sp=> (sp.finger||[]).forEach(f=>{
    const name = f.name || String(f);
    if (name) fingerCount[name] = (fingerCount[name]||0)+1;
  }));
  const topFingers = Object.entries(fingerCount).sort((a,b)=>b[1]-a[1]).slice(0,8);

  const statCard = (v,k)=>`<div class="card stat"><div class="v">${v}</div><div class="k">${k}</div></div>`;
  $("#view").innerHTML = `
    <h2 class="page">看板</h2>
    <div class="grid g4">
      ${statCard(s.domains,"域名")}${statCard(s.sites,"站点")}${statCard(s.ips,"IP")}
      ${statCard(s.vulns,"漏洞")}
    </div>
    <div class="grid g2" style="margin-top:16px">
      <div class="card">
        <div style="margin-bottom:10px">近 14 天任务提交</div>
        <svg id="trend-svg" width="100%" height="150" viewBox="0 0 560 150" preserveAspectRatio="none"></svg>
      </div>
      <div class="card">
        <div style="margin-bottom:10px">漏洞严重度分布</div>
        <div id="sev-donut"></div>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div style="margin-bottom:8px">近期任务${s.running_tasks?`（运行中 ${s.running_tasks}）`:""}</div>
      <div id="ov-tasks"></div>
    </div>
    <details style="margin-top:16px">
      <summary style="cursor:pointer;color:var(--acc)">健康指标与统计分布</summary>
      <div class="grid g3" style="margin-top:12px">
        <div class="card stat"><div class="v" style="font-size:18px">${rate}</div><div class="k">近期任务成功率</div></div>
        <div class="card stat"><div class="v" style="font-size:18px">${h.api_token_active ?? "—"}</div><div class="k">活跃会话</div></div>
        <div class="card stat"><div class="v" style="font-size:18px">${fengLeft} ${fengBadge}</div><div class="k">凤鸟 token 剩余</div></div>
      </div>
      <div class="grid g2" style="margin-top:12px">
        <div class="card"><div style="margin-bottom:8px">开放最多的端口</div><div id="top-ports"></div></div>
        <div class="card"><div style="margin-bottom:8px">Top 指纹</div><div id="top-fingers"></div></div>
      </div>
    </details>`;

  /* 统计数字滚动（GSAP，仅纯整数值） */
  if (window.gsap){
    document.querySelectorAll(".stat .v").forEach(el=>{
      const v = el.textContent.trim();
      if (!/^\d+$/.test(v)) return;
      const obj = {n:0};
      gsap.to(obj, {n:parseInt(v,10), duration:.7, ease:"power2.out",
        onUpdate:()=>{ el.textContent = String(Math.round(obj.n)); }});
    });
  }

  /* 趋势折线 */
  const svg = $("#trend-svg");
  const W=560, H=150, pad=24;
  const step = (W-pad*2)/Math.max(perDay.length-1,1);
  const pts = perDay.map((v,i)=>[pad+i*step, H-pad-(v/maxT)*(H-pad*2)]);
  svg.innerHTML =
    pts.map(([x,y])=>`<line x1="${x}" y1="${H-pad}" x2="${x}" y2="${y}" stroke="#2b3a55" stroke-width="6"></line>`).join("") +
    `<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#4d8dff" stroke-width="2"/>` +
    pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="3" fill="#4d8dff"><title>${days[i]}: ${perDay[i]}</title></circle>`).join("") +
    [0, .5, 1].map(f=>`<text x="${pad}" y="${H-pad-(f*(H-pad*2))+12}" fill="#57607a" font-size="10">${Math.round(maxT*f)}</text>`).join("") +
    days.map((d,i)=> i%2===0 ? `<text x="${pts[i][0]}" y="${H-4}" fill="#57607a" font-size="9" text-anchor="middle">${d}</text>` : "").join("");

  /* donut */
  const total = Object.values(sevCount).reduce((a,b)=>a+b,0);
  const segs = [["critical",sevCount.critical,"#e05656"],["high",sevCount.high,"#e8734d"],
                ["medium",sevCount.medium,"#e8b23a"],["low",sevCount.low,"#3fbf72"]];
  let offset = 0; const C = 2*Math.PI*52;
  let circles = "";
  if (total){
    segs.forEach(([name,val,color])=>{
      if (!val) return;
      const frac = val/total, len = frac*C;
      circles += `<circle r="52" cx="70" cy="70" fill="none" stroke="${color}" stroke-width="16"
        stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 70 70)"/>`;
      offset += len;
    });
  } else {
    circles = `<circle r="52" cx="70" cy="70" fill="none" stroke="#242d3d" stroke-width="16"/>`;
  }
  $("#sev-donut").innerHTML = `<svg width="140" height="140">${circles}
      <text x="70" y="66" text-anchor="middle" fill="#d9e1ee" font-size="22" font-weight="600">${total}</text>
      <text x="70" y="86" text-anchor="middle" fill="#7f8aa0" font-size="11">漏洞</text></svg>
    <div class="legend" style="margin-top:4px">${segs.map(([n,v,c])=>
      `<span><i class="dot" style="background:${c}"></i>${n} ${v}</span>`).join("")}</div>`;

  const bars = (items)=> items.length ? items.map(([name,val])=>`
      <div class="bar-row"><span class="name mono" title="${esc(name)}">${esc(name)}</span>
      <div class="bar"><i style="width:${Math.round(val/Math.max(...items.map(x=>x[1]))*100)}%"></i></div>
      <span class="num">${val}</span></div>`).join("") : '<div class="dim2">—</div>';
  $("#top-ports").innerHTML = bars(topPorts.map(([p,v])=>[String(p)+"端口", v]));
  $("#top-fingers").innerHTML = bars(topFingers);

  /* 近期任务 */
  const rows = tasks.slice(0,8);
  $("#ov-tasks").innerHTML = rows.length ? `<table><tbody>${rows.map(r=>{
    const st = esc(r.status||"");
    const cls = st==="done"?"b-ok":(st==="error"?"b-bad":(st==="waiting"?"b-dim":"b-info"));
    return `<tr><td>${esc(r.name||"")}</td><td class="mono">${esc(r.target||"")}</td>
      <td><span class="badge ${cls}">${st}</span></td>
      <td class="mono dim">${esc((r.start_time||"-").slice(0,19))}</td></tr>`;
  }).join("")}</tbody></table>` : '<div class="dim2">暂无任务</div>';
};

/* ============================ 资产检索（单搜索栏智能路由 + 筛选 chip + 详情抽屉） ============================ */
const ASSET_KINDS = {
  site: {title:"站点", api:"asset_site",
         cols:["站点","标题","状态码","指纹","来源"],
         fields:["site","title","status","finger.name","source"],
         route(v){
           if (/^https?:\/\//.test(v) || v.includes("/")) return "site";
           if (/^\d{1,3}(\.\d{1,3}){3}$/.test(v)) return "ip";
           if (/^\d{2,5}$/.test(v)) return "status";
           return "site";
         }},
  domain:{title:"域名", api:"asset_domain",
          cols:["域名","来源"], fields:["domain","source"],
          route(){ return "domain"; }},
  ip:    {title:"IP", api:"asset_ip",
          cols:["IP","端口"], fields:["ip"],
          route(){ return "ip"; }},
  vuln:  {title:"漏洞", api:"vuln",
          cols:["漏洞","严重度","插件","目标"], fields:["vul_name","plg_name","target"],
          route(){ return "vul_name"; }},
  app:   {title:"APP", api:"asset_ext",
          extra:"kind=app",
          cols:["应用名","所属企业","下载量级","安卓更新"],
          fields:["appname","ent_name"],
          route(){ return "appname"; }},
  miniprogram: {title:"小程序", api:"asset_ext",
          extra:"kind=miniprogram",
          cols:["小程序名","类目","所属企业"],
          fields:["name","ent_name"],
          route(){ return "name"; }},
  icp:   {title:"ICP 备案", api:"asset_ext",
          extra:"kind=icp",
          cols:["域名","备案号","网站名","审核日期","所属企业"],
          fields:["hostname","icpnum","ent_name"],
          route(){ return "hostname"; }},
};
const AF_LABEL = {site:"站点",hostname:"主机",ip:"IP",title:"标题",
  "finger.name":"指纹",status:"状态码",source:"来源",domain:"域名",
  vul_name:"漏洞名",plg_name:"插件",target:"目标",
  appname:"应用名",ent_name:"所属企业",icpnum:"备案号",cate:"类目"};

let assetKind = "site", assetPage = 1, assetSize = 50;
let assetRaw = [], assetSortCol = null, assetSortDir = 1;
let assetFilters = {};

ROUTES.assets = function(){ renderAssets("site"); };

function renderAssets(kind){
  assetKind = kind; assetPage = 1; assetFilters = {};
  const conf = ASSET_KINDS[kind];
  $("#view").innerHTML = `
    <h2 class="page">资产检索</h2>
    <div class="row">
      ${Object.keys(ASSET_KINDS).map(k=>
        `<button class="btn ${k===kind?"primary":""}" onclick="renderAssets('${k}')">${ASSET_KINDS[k].title}</button>`).join("")}
    </div>
    <div class="row">
      <input type="text" id="as-q" placeholder="输入关键词 / URL / IP / 状态码，自动识别"
             style="flex:1;min-width:320px" onkeydown="if(event.key==='Enter')asQuickSearch()"/>
      <button class="btn primary" onclick="asQuickSearch()">查询</button>
      <button class="btn" onclick="asToggleAdvanced(this)">高级筛选</button>
      <button class="btn" onclick="assetCsv()">导出 CSV</button>
    </div>
    <div id="as-advanced" style="display:none;margin-bottom:10px">
      <div class="card">
        <div class="row" style="margin:0">
          ${conf.fields.map(f=>`
            <input type="text" class="af" data-f="${f}" placeholder="${AF_LABEL[f]||f}"
                   style="width:150px" onkeydown="if(event.key==='Enter')asApplyAdvanced()"/>`).join("")}
          <select id="af-size">
            ${[25,50,100,200].map(n=>`<option value="${n}" ${n===assetSize?"selected":""}>${n} 条/页</option>`).join("")}
          </select>
          <button class="btn" onclick="asApplyAdvanced()">应用</button>
        </div>
      </div>
    </div>
    <div class="chips" id="as-chips"></div>
    <div class="tblwrap" id="as-table">加载中…</div>
    <div id="as-pager"></div>`;
  loadAssets(1);
}

function asQuickSearch(){
  const v = ($("#as-q")||{}).value.trim();
  assetFilters = {};
  if (v) assetFilters[ASSET_KINDS[assetKind].route(v)] = v;
  assetPage = 1;
  loadAssets(1);
}

function asToggleAdvanced(btn){
  const box = $("#as-advanced");
  box.style.display = box.style.display === "none" ? "block" : "none";
}

function asApplyAdvanced(){
  document.querySelectorAll("#view .af").forEach(i=>{
    const val = i.value.trim();
    if (val) assetFilters[i.dataset.f] = val;
    else delete assetFilters[i.dataset.f];
  });
  assetSize = parseInt(($("#af-size")||{}).value || 50);
  assetPage = 1;
  loadAssets(1);
}

function asRemoveFilter(f){
  delete assetFilters[f];
  loadAssets(1);
}

function asChips(){
  const entries = Object.entries(assetFilters);
  const box = $("#as-chips");
  if (!entries.length){ box.innerHTML = ""; return; }
  box.innerHTML = entries.map(([f,v])=>
    `<span class="chip">${AF_LABEL[f]||f} = ${esc(v)}
      <a href="#" style="color:var(--bad);margin-left:6px"
         onclick="asRemoveFilter('${f}');return false">✕</a></span>`).join("");
}

function assetQuery(){
  const conf = ASSET_KINDS[assetKind];
  const q = [`page=${assetPage}`, `size=${assetSize}`];
  if (conf.extra) q.push(conf.extra);
  Object.entries(assetFilters).forEach(([f,v])=>{
    q.push(`${encodeURIComponent(f)}=${encodeURIComponent(v)}`);
  });
  return q.join("&");
}

async function loadAssets(page){
  if (page) assetPage = page;
  const conf = ASSET_KINDS[assetKind];
  $("#as-table").innerHTML = '<div class="empty">加载中…</div>';
  asChips();
  const apiPath = conf.api || ("asset_" + assetKind);
  const body = await api(`/${apiPath}/?${assetQuery()}`)
    .catch(e=>({}));
  const {items, total} = pickList(body);
  assetRaw = items;
  let rows = items.map((x,i)=>({i, cells: normalizeAsset(assetKind, x)}));
  const st = sortState["asset"];
  if (st && assetSortCol != null){
    const strip = html => String(html).replace(/<[^>]*>/g,"");
    rows = [...rows].sort((a,b)=>{
      const av = strip(a.cells[st.col] ?? ""), bv = strip(b.cells[st.col] ?? "");
      return st.dir * av.localeCompare(bv, undefined, {numeric:true});
    });
  }
  const head = conf.cols.map((c,i)=>
    `<th class="sortable" onclick="assetSort(${i},'${c}')">${c}${sortIcon("asset", String(i))}</th>`).join("");
  $("#as-table").innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${
    rows.map(r=>`<tr style="cursor:pointer" onclick="assetDetail(${r.i})">${
      r.cells.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  $("#as-pager").innerHTML = pagerHtml("asset", assetPage, assetSize, total);
}

function assetSort(colIndex, colName){
  if (assetSortCol === colName) assetSortDir *= -1;
  else { assetSortCol = colName; assetSortDir = 1; }
  sortState["asset"] = {col: colIndex, dir: assetSortDir};
  loadAssets();
}

function normalizeAsset(kind, x){
  const stop = ' onclick="event.stopPropagation()"';
  if (kind === "site"){
    const url = esc(x.site||"");
    return [`<a href="${url}" target="_blank" class="mono"${stop}>${url}</a>`,
      esc(x.title||""), esc(x.status||""),
      (x.finger||[]).map(f=>esc(f.name||f)).join(" "),
      esc(x.source||"")];
  }
  if (kind === "domain")
    return [`<span class="mono">${esc(x.domain)}</span>`, esc(x.source||"")];
  if (kind === "ip")
    return [`<span class="mono">${esc(x.ip)}</span>`,
      `<span class="mono">${(x.port_info||[]).map(p=>p.port_id).join(",")}</span>`];
  if (kind === "app")
    return [esc(x.appname||""), esc(x.ent_name||""),
      esc(x.downloadCountLevel||"—"), esc(x.updateDateAndroid||"—")];
  if (kind === "miniprogram")
    return [esc(x.name||""), esc(x.cate||"—"), esc(x.ent_name||"")];
  if (kind === "icp")
    return [`<span class="mono">${esc(x.hostname||"")}</span>`, esc(x.icpnum||""),
      esc(x.webname||""), esc(x.shdate||"—"), esc(x.ent_name||"")];
  return [esc(x.vul_name||x.name||""),
    `<span class="sev-${esc(String(x.severity||"low").toLowerCase())}">${esc(x.severity||"low")}</span>`,
    esc(x.plg_name||""), `<span class="mono">${esc((x.url||x.target||"").slice(0,50))}</span>`];
}

function assetDetail(idx){
  const x = assetRaw[idx];
  if (!x) return;
  const rows = Object.entries(x)
    .filter(([k])=>k !== "_id")
    .map(([k,v])=>{
      let display = typeof v === "object" ? JSON.stringify(v) : String(v ?? "");
      if (display.length > 200) display = display.slice(0,200) + "…";
      return `<div><b>${esc(k)}</b> ${esc(display)}</div>`;
    }).join("");
  openDrawer(`<h3>资产详情</h3><div class="dl">${rows}</div>`);
}

function assetCsv(){
  const conf = ASSET_KINDS[assetKind];
  const plain = assetRaw.map(x=>normalizeAsset(assetKind, x)
    .map(c=>String(c).replace(/<[^>]*>/g,"")));
  csvDownload(`assets_${assetKind}_${Date.now()}.csv`, conf.cols, plain);
}

/* ============================ 资产组 ============================ */

let scopeCache = [];

ROUTES.scopes = async function(){
  $("#view").innerHTML = `
    <h2 class="page">资产组</h2>
    <div class="row">
      <button class="btn primary" onclick="openScopeForm()">新建资产组</button>
      <button class="btn" onclick="ROUTES.scopes()">刷新</button>
      <span class="dim2" style="font-size:13px">域名 / IP 段集合——监控任务、计划扫描与报告的边界</span>
    </div>
    <div class="tblwrap" id="sc-table">加载中…</div>`;
  const [body, polB] = await Promise.all([
    api("/asset_scope/?size=500").catch(e=>({})),
    api("/policy/?size=200").catch(e=>({})),
  ]);
  const {items} = pickList(body);
  scopeCache = items;
  scopePolicies = (polB.data && polB.data.items) || [];
  $("#sc-table").innerHTML = items.length ?
    `<table><thead><tr><th>名称</th><th>类型</th><th>范围</th><th>黑名单</th><th>操作</th></tr></thead>
     <tbody>${items.map(r=>{
       const arr = r.scope_array || (r.scope||"").split(",") || [];
       const shown = arr.slice(0,6);
       const black = r.black_scope_array || [];
       return `<tr>

async function scopeMonitor(scopeId, domain){
  const interval = parseInt(($("#sd-interval")||{}).value || 86400, 10);
  const policyId = ($("#sd-policy")||{}).value || "";
  const payload = {scope_id: scopeId, domain, interval, name: ""};
  if (policyId) payload.policy_id = policyId;
  const body = await api("/scheduler/add/", {method:"POST", json:payload})
    .catch(e=>({message:String(e)}));
  if (body.code === 200) toast("监控任务已创建——计划任务页可查");
  else toast(body.message || "创建失败");
}

async function scopeAddEntry(scopeId){
  const scope = ($("#sd-add")||{}).value.trim();
  if (!scope){ toast("请输入范围条目"); return; }
  const body = await api("/asset_scope/add/", {method:"POST", json:{scope, scope_id: scopeId}})
    .catch(e=>({message:String(e)}));
  if (body.code === 200){ toast("已添加"); ROUTES.scopes().then(()=>scopeDetail(scopeId)); }
  else toast(body.message || "添加失败");
}

async function scopeRemoveEntry(scopeId, scope){
  if (!confirm("从资产组移除 " + scope + " ？")) return;
  const body = await api("/asset_scope/delete/?scope=" + encodeURIComponent(scope) +
    "&scope_id=" + scopeId).catch(e=>({message:String(e)}));
  if (body.code === 200){ toast("已移除"); ROUTES.scopes().then(()=>scopeDetail(scopeId)); }
  else toast(body.message || "移除失败");
}

async function scopeDelete(scopeId, name){
  if (!confirm("确认删除资产组「" + name + "」？其下资产与监控任务将一并删除。")) return;
  const body = await api("/asset_scope/delete/", {method:"POST", json:{scope_id:[scopeId]}})
    .catch(e=>({message:String(e)}));
  if (body.code === 200){ toast("已删除"); closeDrawer(); ROUTES.scopes(); }
  else toast(body.message || "删除失败");
}

let taskPage = 1, taskStatus = "", taskKw = "";
ROUTES.tasks = function(){
  $("#view").innerHTML = `
    <h2 class="page">任务管理</h2>
    <div class="row">
      <button class="btn primary" onclick="openTaskForm()">新建任务</button>
      <select id="tk-status" onchange="taskPage=1;loadTasks()">
        <option value="">全部状态</option>
        ${["waiting","doing","done","error","stop"].map(s=>`<option value="${s}">${s}</option>`).join("")}
      </select>
      <input type="text" id="tk-kw" placeholder="名称/目标" style="width:200px"
             onkeydown="if(event.key==='Enter'){taskPage=1;loadTasks()}"/>
      <button class="btn" onclick="taskPage=1;loadTasks()">查询</button>
      <button class="btn danger" onclick="taskBatchStop()">批量停止</button>
      <button class="btn" onclick="ROUTES.tasks()">刷新</button>
      <span class="dim2" style="font-size:13px" id="tk-count"></span>
    </div>
    <div class="tblwrap" id="tk-table">加载中…</div>
    <div id="tk-pager"></div>`;
  loadTasks();
};
async function loadTasks(){
  const st = ($("#tk-status")||{}).value || taskStatus;
  const kw = ($("#tk-kw")||{}).value || taskKw;
  const q = [`page=${taskPage}`, `size=25`];
  if (st) q.push("status="+st);
  if (kw) q.push("keyword="+encodeURIComponent(kw));
  $("#tk-table").innerHTML = '<div class="empty">加载中…</div>';
  const body = await api("/task/?"+q.join("&")).catch(e=>({}));
  const {items, total} = pickList(body);
  const tkCount = $("#tk-count"); if (tkCount) tkCount.textContent = `共 ${total} 条`;
  const tbl = $("#tk-table");
  if (!items.length){ tbl.innerHTML = '<div class="empty">暂无任务</div>';
    $("#tk-pager").innerHTML = pagerHtml("tk", taskPage, 25, 0); return; }
  tbl.innerHTML = `<table><thead><tr>
      <th><input type="checkbox" onclick="tkCheckAll(this)"/></th>
      <th>名称</th><th>目标</th><th>状态</th><th>开始时间</th><th>结束时间</th><th>操作</th></tr></thead>
    <tbody>${items.map(r=>{
      const id = esc(r._id), st = esc(r.status||"");
      const cls = st==="done"?"b-ok":(st==="error"?"b-bad":(st==="waiting"||st==="doing"?"b-info":"b-dim"));
      const running = !["done","error","stop"].includes(st);
      const settled = ["done","error","stop"].includes(st);
      return `<tr><td><input type="checkbox" class="tk-ck" data-id="${id}"/></td>
        <td>${esc(r.name||"")}</td><td class="mono">${esc(r.target||"")}</td>
        <td><span class="badge ${cls}">${st}</span></td>
        <td class="mono dim">${esc((r.start_time||"-").slice(0,19))}</td>
        <td class="mono dim">${esc((r.end_time||"-").slice(0,19))}</td>
        <td style="white-space:nowrap">
          <a href="#" onclick="taskDetail('${id}');return false">详情</a>
          ${running?` · <a href="#" onclick="taskStop('${id}');return false">停止</a>`:""}
          ${settled?` · <a href="#" onclick="taskRestart('${id}');return false">重跑</a>`:""}
          ${settled?` · <a href="#" onclick="taskDelete('${id}');return false" style="color:var(--bad)">删除</a>`:""}
        </td></tr>`;
    }).join("")}</tbody></table>`;
  $("#tk-pager").innerHTML = pagerHtml("tk", taskPage, 25, total);
}
function tkCheckAll(box){
  document.querySelectorAll(".tk-ck").forEach(c=>c.checked = box.checked);
}
function checkedTaskIds(){
  return [...document.querySelectorAll(".tk-ck:checked")].map(c=>c.dataset.id);
}
async function taskStop(id){
  await api("/task/stop/"+id); toast("已停止"); loadTasks();
}
async function taskBatchStop(){
  const ids = checkedTaskIds();
  if (!ids.length){ toast("请先勾选任务"); return; }
  await api("/task/batch_stop/", {method:"POST", json:{task_id: ids}});
  toast("已批量停止"); loadTasks();
}
async function taskRestart(id){
  await api("/task/restart/", {method:"POST", json:{task_id:[id]}});
  toast("已重新入队"); loadTasks();
}
async function taskDelete(id){
  if (!confirm("确认删除该任务？")) return;
  await api("/task/delete/", {method:"POST", json:{task_id:[id], del_task_data:true}});
  toast("已删除"); loadTasks();
}
async function taskDetail(id){
  const body = await api("/task/stage/?task_id="+id).catch(e=>({}));
  const items = (body.data && (body.data.items || body.data)) || [];
  const arr = Array.isArray(items) ? items : Object.values(items);
  arr.sort((a,b)=> (a.order ?? stageOrderOf(a)) - (b.order ?? stageOrderOf(b)));
  openDrawer(`<h3>任务阶段</h3><div class="tl">${
    arr.length ? arr.map(s=>{
      const st = esc(s.status||"");
      const cls = st==="done"?"done":(st==="error"?"error":"doing");
      return `<div class="item ${cls}"><b>${esc(s.stage||s.name||"")}</b>
        <span class="badge ${st==="done"?"b-ok":(st==="error"?"b-bad":"b-info")}">${st}</span>
        ${s.error?`<div style="color:var(--bad);font-size:13px">${esc(String(s.error).slice(0,120))}</div>`:""}
      </div>`;
    }).join("") : '<div class="dim2">无阶段数据</div>'}</div>`);
}
function stageOrderOf(_s){ return 0; }

function tfApplyTemplate(btn){
  const key = btn.dataset.tpl;
  const tpl = TASK_TEMPLATES[key];
  if (!tpl) return;
  document.querySelectorAll("[data-tpl]").forEach(b=>
    b.classList.toggle("primary", b.dataset.tpl === key));
  $("#tf-tpl-desc").textContent = tpl.desc;
  $("#tf-port").value = tpl.port;
  $("#tf-port-custom").style.display = tpl.port === "custom" ? "" : "none";
  TF_ALL_OPTS.forEach(([k])=>{
    const ck = document.getElementById("ck-"+k);

async function submitTask(){
  const target = $("#tf-target").value.trim();
  const name = $("#tf-name").value.trim();
  if (!target || !name){ toast("目标与任务名必填"); return; }
  const payload = {name, target};
  document.querySelectorAll("#tf-checks input").forEach(c=>{
    const key = c.id.replace("ck-","");
    payload[key] = c.checked;
    if (key==="nuclei_scan" && c.checked) payload.nuclei_scan_confirm = true;
  });
  payload.port_scan = true;
  payload.port_scan_type = $("#tf-port").value;
  if (payload.port_scan_type === "custom")
    payload.port_custom = $("#tf-port-custom").value.trim();
  const body = await api("/task/", {method:"POST", json:payload}).catch(e=>({message:String(e)}));
  if (body.code === 200){ toast("任务已下发"); closeDrawer(); go("#/tasks"); ROUTES.tasks(); }
  else toast(body.message || "下发失败");
}

function pfCollect(groupId){
  const out = {};
  document.querySelectorAll("#"+groupId+" input[data-k]").forEach(c=>{
    out[c.dataset.k] = c.checked;
  });
  return out;
}

async function submitPolicy(id){
  const name = $("#pf-name").value.trim();
  if (!name){ toast("策略名称必填"); return; }
  const ipConfig = {
    port_scan: $("#pf-portscan").checked,
    port_scan_type: $("#pf-port-type").value,
    service_detection: false, os_detection: false, ssl_cert: false,
  };
  Object.assign(ipConfig, pfCollect("pf-ip"));
  if (ipConfig.port_scan_type === "custom")
    ipConfig.port_custom = $("#pf-port-custom").value.trim();
  const siteConfig = pfCollect("pf-sc");
  if (siteConfig.nuclei_scan) siteConfig.nuclei_scan = true;
  const payload = {
    name,
    desc: $("#pf-desc").value.trim(),
    policy: {
      domain_config: pfCollect("pf-dc"),
      ip_config: ipConfig,
      site_config: siteConfig,
      file_leak: $("#pf-fileleak").checked,
      npoc_service_detection: $("#pf-npoc").checked,
    },
  };
  let body;
  if (id){
    body = await api("/policy/edit/", {method:"POST",
      json:{policy_id: id, policy_data: payload}}).catch(e=>({message:String(e)}));
  } else {
    body = await api("/policy/add/", {method:"POST", json:payload}).catch(e=>({message:String(e)}));
  }
  if (body.code === 200){ toast("策略已保存"); closeDrawer(); loadPolicies(); }
  else toast(body.message || "保存失败");
}

async function policyGraph(id){
  const item = policyCache.find(p=>p._id===id);
  const body = await api("/policy_yaml/graph/?policy_id="+encodeURIComponent(id)).catch(e=>({}));
  if (body.code!==200){ openDrawer(`<h3>执行图</h3><div class="empty">${esc((body.data||{}).error||"加载失败")}</div>`); return; }
  const g = body.data.graph;
  const PH = {light:"轻量探测",heavy_top:"重量探测（Top1000）",heavy_full:"全量扫描",
              post:"后置深化",post_finalize:"收尾统计"};
  openDrawer(`<h3>执行图 · ${esc((item&&item.name)||"")}</h3>
    <div class="dim2" style="font-size:13px;margin-bottom:10px">启用 ${g.summary.enabled} · 条件 ${g.summary.auto} · 关闭 ${g.summary.disabled} · 共 ${g.summary.total_stages} 阶段</div>
    ${g.phases.map(p=>{
      const nodes = p.nodes.map(n=>{
        const cls = n.state==="enabled"?"b-ok":(n.state==="disabled"?"b-dim":"b-warn");
        const deco = n.state==="disabled" ? "text-decoration:line-through;opacity:.55" : "";
        return `<span class="badge ${cls}" style="${deco};margin:2px 4px 2px 0" title="${n.stage}">${esc(n.name)}</span>`;
      }).join('<span class="dim2">→</span>');
      return `<div style="margin:8px 0"><span class="dim2" style="font-size:12px;display:block;margin-bottom:4px">${PH[p.phase]||p.phase}</span>${nodes}</div>`;
    }).join("")}`);
}

      ${!(o.added||[]).length&&!(o.removed||[]).length&&!(o.changed||[]).length&&!(o.expiring||[]).length?'<div class="dim2">无</div>':""}</div>`;

  openDrawer(`<h3>变化明细（${esc((body.data&&body.data.diff&&body.data.diff.target)||"")}）</h3>

    ${sec("页面标题", d.titles)}${sec("证书", d.certs)}${sec("APP", d.apps)}`);
}

async function fetchRisks(){
  const box = $("#risk-table");
  if (!box) return;
  box.innerHTML = '<div class="empty">加载中…</div>';
  const q = ["page="+riskPage, "size=25"];
  const sev = ($("#rv-sev")||{}).value || "";
  const target = ($("#rv-target")||{}).value || "";
  if (riskTab === "vuln"){
    const vul = ($("#rv-vul")||{}).value || "";
    if (sev) q.push("severity="+sev);
    if (vul) q.push("vul_name="+encodeURIComponent(vul));
    if (target) q.push("target="+encodeURIComponent(target));
  } else {
    if (sev) q.push("vuln_severity="+sev);
    if (target) q.push("target="+encodeURIComponent(target));
  }
  const body = await api("/"+(riskTab==="vuln"?"vuln":"nuclei_result")+"/?"+q.join("&"))
    .catch(e=>({}));
  const {items, total} = pickList(body);
  riskRaw = items;
  const count = $("#rv-count");
  if (count) count.textContent = `共 ${total} 条`;
  const stop = ' onclick="event.stopPropagation()"';
  if (riskTab === "vuln"){
    box.innerHTML = items.length ?
      `<table><thead><tr><th><input type="checkbox" onclick="document.querySelectorAll('.rk-ck').forEach(c=>c.checked=this.checked)"/></th>

        <td><span class="sev-${esc(String(r.severity||"low").toLowerCase())}">${esc(r.severity||"low")}</span></td>
        <td>${esc(r.plg_name||"")}</td>
        <td class="mono" style="max-width:180px">${esc(r.target||"")}</td>
        <td class="mono" style="max-width:220px"><a href="${esc(r.url||"")}" target="_blank"${stop}>${esc((r.url||"").slice(0,40))}</a></td>
        <td><a href="#" onclick="riskDetail(${i});return false">详情</a></td></tr>`).join("")}</tbody></table>`
      : '<div class="empty">暂无漏洞记录</div>';
  } else {
    box.innerHTML = items.length ?
      `<table><thead><tr><th><input type="checkbox" onclick="document.querySelectorAll('.rk-ck').forEach(c=>c.checked=this.checked)"/></th>
        <th>模板</th><th>漏洞</th><th>等级</th><th>URL</th><th></th></tr></thead>
      <tbody>${items.map((r,i)=>`<tr>
        <td><input type="checkbox" class="rk-ck" data-id="${esc(r._id)}"/></td>
        <td class="mono">${esc(r.template_id||"")}</td>
        <td>${esc(r.vuln_name||"")}</td>
        <td><span class="sev-${esc(String(r.vuln_severity||"low").toLowerCase())}">${esc(r.vuln_severity||"")}</span></td>
        <td class="mono" style="max-width:300px">${esc((r.vuln_url||"").slice(0,60))}</td>
        <td><a href="#" onclick="riskDetail(${i});return false">详情</a></td></tr>`).join("")}</tbody></table>`
      : '<div class="empty">暂无 Nuclei 结果</div>';
  }
  const pager = $("#risk-pager");
  if (pager) pager.innerHTML = pagerHtml("risk", riskPage, 25, total);
}

function riskDetail(idx){
  const x = riskRaw[idx];
  if (!x) return;
  const rows = Object.entries(x)
    .filter(([k])=>k !== "_id")
    .map(([k,v])=>{
      let display = typeof v === "object" ? JSON.stringify(v) : String(v ?? "");
      if (display.length > 300) display = display.slice(0,300) + "…";
      return `<div><b>${esc(k)}</b> ${esc(display)}</div>`;
    }).join("");
  const curl = x.curl_command
    ? `<h4>复现命令</h4>
       <textarea readonly style="width:100%;height:90px;font-family:var(--mono);font-size:12px"
         onclick="this.select()">${esc(x.curl_command)}</textarea>
       <button class="btn sm" style="margin-top:6px"
         onclick="navigator.clipboard.writeText(this.previousElementSibling.value).then(()=>toast('已复制'))">复制 curl</button>`
    : "";
  openDrawer(`<h3>${esc(x.vul_name||x.vuln_name||"风险详情")}</h3>
    <div class="dl">${rows}</div>${curl}`);
}

async function fpTop(){
  const el = $("#fp-top");
  if (!el) return;
  const body = await api("/stat_finger/?size=500").catch(e=>({}));
  const items = pickList(body).items;
  const sum = {};
  items.forEach(r=>{ sum[r.name] = (sum[r.name]||0) + (r.cnt||0); });
  const top = Object.entries(sum).sort((a,b)=>b[1]-a[1]).slice(0,8);
  el.innerHTML = top.length ? top.map(([name,val])=>`
    <div class="bar-row"><span class="name mono" title="${esc(name)}">${esc(name)}</span>
    <div class="bar"><i style="width:${Math.round(val/top[0][1]*100)}%"></i></div>
    <span class="num">${val}</span></div>`).join("") : '<div class="dim2">暂无统计</div>';
}

async function submitFp(){

    .catch(e=>({message:String(e)}));

  else toast(body.message || "保存失败（规则校验不通过会提示）");

function openFpUpload(){
  openDrawer(`<h3>上传指纹 YAML</h3>

async function fpUpload(){
  const f = ($("#fp-file")||{}).files?.[0];
  if (!f){ toast("请选择 YAML 文件"); return; }
  const fd = new FormData();
  fd.append("file", f);
  fd.append("update", $("#fp-update").checked ? "true" : "");
  const r = await fetch(API+"/fingerprint/upload/",
    {method:"POST", headers:{"Token": token()}, body: fd});
  const body = await r.json().catch(()=>({}));
  if (body.code === 200){
    const d = body.data||{};
    toast(`成功 ${d.success_cnt} · 重复 ${d.repeat_cnt} · 更新 ${d.update_cnt} · 失败 ${d.error_cnt}`);
    closeDrawer(); loadFingerprints();
  } else toast((body.data&&body.data.msg)||body.message||"上传失败");
}

async function fpExport(){
  try{
    const r = await fetchRaw("/fingerprint/export/");
    const blob = await r.blob();

async function aiJudgePoll(ids, collection, rounds){
  clearInterval(aiJudgeTimer);
  const box = $("#ai-judge-result");
  const fetchOnce = async ()=>{
    const body = await api("/ai/judge_result", {method:"POST", json:{site_ids: ids, collection}})
      .catch(e=>({}));
    const items = (body.data&&body.data.items)||[];
    if (!box) { clearInterval(aiJudgeTimer); return; }
    box.innerHTML = items.length ?
      `<table><thead><tr><th>站点</th><th>标题</th><th>状态</th><th>优先级</th><th>结论</th></tr></thead>
       <tbody>${items.map(r=>{
         const st = esc(r.ai_state||"pending");
         const cls = st==="done"?"b-ok":(st==="error"?"b-bad":"b-info");
         return `<tr><td class="mono">${esc((r.site||"").slice(0,40))}</td>
          <td>${esc(r.title||"")}</td>
          <td><span class="badge ${cls}">${st}</span></td>
          <td class="mono">${esc(r.ai_priority??"—")}</td>
          <td style="color:var(--dim);font-size:13px">${esc((r.ai_summary||r.ai_error||"—").slice(0,80))}</td></tr>`;
       }).join("")}</tbody></table>`
      : '<div class="dim2">无结果</div>';
    return items.every(r=>r.ai_state==="done"||r.ai_state==="error");
  };
  let left = rounds;
  await fetchOnce();
  aiJudgeTimer = setInterval(async ()=>{
    left -= 1;
    const settled = await fetchOnce();
    if (settled || left <= 0) clearInterval(aiJudgeTimer);
  }, 4000);
}

        <div style="margin-top:8px;line-height:1.9">
          浏览器登录目标站后按 F12 → Application → Cookies → 复制 token 值（完整 JWT，含两个点）。
          <div class="chips" style="margin-top:6px">
            <span class="chip">凤鸟 www.riskbird.com · token</span>
            <span class="chip">爱企查 aiqicha.baidu.com</span>
            <span class="chip">天眼查 www.tianyancha.com</span>
          </div>
          也可粘贴完整 cookie 串（token=xxx; app-uuid=...）。无头自动登录：scripts/session_login.py
        </div>
      </details>
      <details style="margin-top:10px">
        <summary style="cursor:pointer;color:var(--acc)">高级：导入 storage_state JSON</summary>

        </div>

};

function spBadge(status){
  if (status==="ok") return '<span class="badge b-ok">有效</span>';
  if (status==="expired") return '<span class="badge b-bad">已过期</span>';
  return '<span class="badge b-dim">未就绪</span>';
}

async function loadSessions(){
  const body = await api("/session_pool/accounts/").catch(e=>({}));
  const items = (body.data && body.data.accounts) || [];
  const list = $("#sp-list");
  if (!items.length){
    list.innerHTML = '<div class="card empty">暂无数据源——在上方粘贴 token 接入</div>';
    return;
  }
  list.innerHTML = items.map(a=>{
    const src = esc(a.source), acc = esc(a.account);
    const left = a.expires_hint>0 ? ((a.expires_hint*1000-Date.now())/3600000) : null;
    return `<div class="card" style="margin-bottom:12px">
      <div class="row" style="margin:0">
        <span class="badge ${a.status==="ok"?"b-ok":(a.status==="expired"?"b-bad":"b-dim")}">&nbsp;</span>
        <span>${src} / ${acc}</span>
        ${spBadge(a.status)}
        ${left!=null?`<span style="color:var(--dim)">${left>0?"剩余 "+left.toFixed(1)+"h":"已到期"}</span>`:""}
        <span class="spacer"></span>
        <button class="btn sm primary" data-src="${src}" data-acc="${acc}" onclick="spOpenWindow(this)">窗口登录</button>
        <button class="btn sm" data-src="${src}" data-acc="${acc}" onclick="spProbe(this)">探活</button>
        <button class="btn sm" onclick="spToggleReboard(this)">重新录入</button>
        <button class="btn sm danger" data-src="${src}" data-acc="${acc}" onclick="spDelete(this)">删除</button>
      </div>
      <div class="sp-reboard" style="display:none;margin-top:12px">
        <div class="row" style="margin:0">
          <input type="text" placeholder="粘贴新 token 或 cookie 串"
                 style="flex:1;min-width:240px"/>
          <button class="btn" data-src="${src}" data-acc="${acc}"
                  onclick="spReboardSubmit(this)">更新并探活</button>
        </div>
      </div>
      <div style="margin-top:10px">
        <a href="#" style="color:var(--acc)"
           data-src="${src}" data-acc="${acc}" onclick="spDetail(this);return false">详情</a>
      </div>
    </div>`;
  }).join("");
}

async function spImportJson(){
  let state;
  try { state = JSON.parse($("#sp-json").value); } catch(e){ toast("JSON 解析失败"); return; }
  const source = $("#sp-source").value;
  const account = ($("#sp-account").value.trim() || "default");
  const body = await api("/session_pool/import_state/", {method:"POST",
    json:{source, account, state}}).catch(e=>({message:String(e)}));
  if (body.code === 200){
    toast(body.data && body.data.ok ? "导入成功" : "已入池，探活未通过");
    $("#sp-json").value = "";
    loadSessions();
  } else {
    toast(body.message || "导入失败");
  }
}

async function spOnboard(){
  const token = $("#sp-token").value.trim();
  if (!token){ toast("请粘贴 token"); $("#sp-token").focus(); return; }
  const btn = $("#sp-onboard-btn");
  const source = $("#sp-source").value;
  const account = ($("#sp-account").value.trim() || "default");
  btn.disabled = true; btn.textContent = "接入中…";
  const body = await api("/session_pool/set_token/", {method:"POST",
    json:{source, account, token}}).catch(e=>({message:String(e)}));
  btn.disabled = false; btn.textContent = "接入并探活";
  if (body.code === 200){
    toast(body.data && body.data.ok ? "已接入，状态正常" : "已接入，探活未通过");
    $("#sp-token").value = "";
    loadSessions();
  } else {
    toast(body.message || "接入失败");
  }
}

function spToggleReboard(btn){
  const box = btn.closest(".card").querySelector(".sp-reboard");
  box.style.display = box.style.display === "none" ? "block" : "none";
}

async function spReboardSubmit(btn){
  const src = btn.dataset.src, acc = btn.dataset.acc;
  const input = btn.previousElementSibling;
  const token = input.value.trim();
  if (!token){ toast("请粘贴 token"); return; }
  btn.disabled = true; btn.textContent = "更新中…";
  const body = await api("/session_pool/set_token/", {method:"POST",
    json:{source: src, account: acc, token}}).catch(e=>({message:String(e)}));
  btn.disabled = false; btn.textContent = "更新并探活";
  toast(body.code === 200 ? (body.data && body.data.ok ? "已更新" : "已更新，探活未通过")
                          : (body.message || "更新失败"));
  if (body.code === 200) loadSessions();
}

async function spProbe(btn){
  const src = btn.dataset.src, acc = btn.dataset.acc;
  btn.disabled = true;
  const body = await api("/session_pool/probe/", {method:"POST",
    json:{source: src, account: acc}}).catch(e=>({message:String(e)}));
  btn.disabled = false;
  if (body.code === 200){
    toast(body.data && body.data.ok ? "探活通过"
          : ("探活未通过：" + ((body.data && body.data.detail) || "")));
    loadSessions();
  } else {
    toast(body.message || "探活失败");
  }
}

async function spDelete(btn){
  const src = btn.dataset.src, acc = btn.dataset.acc;
  if (!confirm("确认删除该数据源？已入池的登录态将失效。")) return;
  const body = await api("/session_pool/accounts/", {method:"DELETE",
    json:{source: src, account: acc}}).catch(e=>({message:String(e)}));
  toast(body.code === 200 ? "已删除" : (body.message || "删除失败"));
  if (body.code === 200) loadSessions();
}

async function spDetail(btn){
  const src = btn.dataset.src, acc = btn.dataset.acc;
  const body = await api("/session_pool/accounts/").catch(e=>({}));
  const items = (body.data && body.data.accounts) || [];
  const doc = items.find(a=>a.source===src && a.account===acc) || {};
  const exp = doc.expires_hint>0 ? new Date(doc.expires_hint*1000).toLocaleString() : "—";
  openDrawer(`<h3>${esc(src)} / ${esc(acc)}</h3>
    <div class="dl">

      <div><b>到期</b> ${esc(exp)}</div>

      ${doc.last_error?`<div><b>错误</b> <span style="color:var(--bad)">${esc(doc.last_error)}</span></div>`:""}
    </div>`);
}

async function loadEnterprise(){
  // 集团概览
  try{
    const gb = await api("/fengniao/groups/?limit=10");
    const groups = (gb.data && gb.data.items) || [];
    $("#en-groups").innerHTML = groups.length ? groups.map(g=>{
      const icp = g.icp_count ?? g.new_domain_count ?? 0;
      const app = g.app_count ?? (g.companies||[]).reduce((n,c)=>n+((c.app||[]).length),0) ?? 0;
      return `<div class="row" style="margin:4px 0">
        <span>${esc(g.root_name || g.name || g.keyword || "")}</span>
        <span class="badge b-info">ICP ${icp}</span>
        <span class="badge b-dim">APP ${app}</span>
      </div>`;
    }).join("") : '<span class="dim2">暂无集团采集——在引擎/凤鸟采集后显示</span>';
  }catch(e){ $("#en-groups").innerHTML = '<span class="dim2">—</span>'; }

  // APP 列表（全量，按公司分组）
  const body = await api("/appdl/apps/?enrich=0").catch(e=>({}));
  const items = (body.data && body.data.items) || [];
  const box = $("#en-apps");
  if (!items.length){ box.innerHTML = '<div class="card empty">暂无 APP 情报——请先进行企业采集</div>'; return; }

  const byEnt = {};
  items.forEach(it=>{ (byEnt[it.ent_name] = byEnt[it.ent_name] || []).push(it); });
  box.innerHTML = Object.entries(byEnt).map(([ent, apps])=>`
    <div class="card" style="margin-bottom:12px">
      <div style="font-size:15px;font-weight:600;margin-bottom:10px">${esc(ent)}
        <span class="badge b-dim">${apps.length} 个 APP</span></div>
      ${apps.map(it=>{
        const dl = it.local;
        return `<div class="row" style="margin:8px 0;padding:8px 0;border-top:1px solid var(--line)">
          <span>${esc(it.appname)}</span>
          <span class="badge ${CONF_B[it.confidence]||"b-dim"}">${CONF_T[it.confidence]||"—"}</span>
          ${it.android_url?`<a href="${esc(it.android_url)}" target="_blank">应用宝</a>`:""}
          ${it.ios_url?`<a href="${esc(it.ios_url)}" target="_blank">App Store</a>`:""}
          <span class="spacer"></span>
          ${it.android_pkg?`<span class="dim2 mono">${esc(it.android_pkg)}</span>`:""}
          <button class="btn sm" data-intel="${esc(it.intel_id)}" data-idx="${it.app_index}"
                  onclick="enDownload(this)">下载 APK</button>
          ${dl?`<a class="badge b-ok" href="/api/appdl/file/?doc_id=${dl.file_id}&Token=${encodeURIComponent(token())}">已下载</a>`:""}
        </div>`;
      }).join("")}
    </div>`).join("");
}

async function enEnrichAll(){
  const btn = $("#en-enrich-all");
  btn.disabled = true;
  let rounds = 0;
  // 每轮 enrich=2（后端单请求上限），直到全部解析或 10 轮
  while (rounds < 10){
    rounds += 1;
    const enHint = $("#en-hint"); if (!enHint) break; enHint.textContent = "解析中… 第 " + rounds + " 轮";
    const body = await api("/appdl/apps/?enrich=2").catch(e=>({}));
    const items = (body.data && body.data.items) || [];
    const pending = items.filter(it=>!it.confidence || it.confidence === "none").length;
    if (!pending) break;
  }
  btn.disabled = false;
  { const _eh = $("#en-hint"); if (_eh) _eh.textContent = ""; }
  toast("解析完成");
  loadEnterprise();
}

async function enDownload(btn){
  const body = await api("/appdl/download/", {method:"POST",
    json:{intel_id: btn.dataset.intel, app_index: parseInt(btn.dataset.idx, 10)}})
    .catch(e=>({message:String(e)}));
  if (body.code !== 200){ toast(body.message || "下载失败"); return; }
  const jobId = body.data && body.data.job_id;
  if (!jobId){ toast("已开始下载"); return; }
  toast("下载中…");
  const poll = setInterval(async ()=>{
    const jb = await api("/appdl/job/?job_id=" + jobId).catch(()=>null);
    const job = jb && jb.data && jb.data.job;
    if (job && (job.status === "done" || job.status === "error")){
      clearInterval(poll);
      toast(job.status === "done" ? "下载完成" : "下载失败");
      loadEnterprise();
    }
  }, 1500);
}

async function notifySave(channel){
  const fields = {};
  document.querySelectorAll(`[id^="nc-${channel}-"]`).forEach(input=>{

    json:{channel, fields}}).catch(e=>({message:String(e)}));
  toast(body.code===200 ? "已保存" : (body.message||"失败"));

}

  ROUTES.settings();
}

let AG = {conv: null, title: "新会话", msgs: [], sending: false, convs: []};

function aiToggle(){
  const p = $("#ai-panel");
  p.classList.toggle("open");
  if (p.classList.contains("open")){ agLoadConvs(); agRender("float"); }
}

function agMsgHtml(m){
  if (m.role === "user")
    return '<div class="ai-msg user">' + esc(m.content) + '</div>';
  let html = '<div class="ai-msg bot">' + esc(m.content || "");
  (m.steps || []).forEach(s=>{
    html += '<div class="tool-step"><b>' + esc(s.name) + '</b> ' + esc(s.text || "") +
      (s.done ? (s.ok ? ' ✓' : ' ✗') : ' …') + '</div>';
  });
  return html + '</div>';
}

function agRender(view){
  ["float", "page"].forEach(v=>{
    const box = $("#ai-msgs-" + v);
    if (!box) return;
    box.innerHTML = AG.msgs.length ? AG.msgs.map(agMsgHtml).join("")
      : '<div class="dim2" style="margin:auto">布置任务给助手——它可以直接调用平台功能（检索资产/下发任务/查风险/生成报告…）</div>';
    box.scrollTop = box.scrollHeight;
    const t = $("#ai-conv-title-" + v);
    if (t) t.textContent = AG.title;
  });
}

async function agLoadConvs(){
  const body = await api("/agent/conversations/").catch(e=>({}));
  AG.convs = (body.data && body.data.items) || [];
  const list = $("#ag-conv-list");
  if (list) list.innerHTML = AG.convs.length ? AG.convs.map(c=>
    `<div class="ai-conv-item ${c._id===AG.conv?"active":""}" onclick="agOpenConv('${esc(c._id)}')">
       <span>${esc(c.title || "新会话")}</span>
       <a href="#" style="float:right;color:var(--dim)" onclick="agDeleteConv('${esc(c._id)}');event.stopPropagation()">✕</a>
     </div>`).join("") : '<div class="empty">暂无会话</div>';
}

function agNew(){
  AG.conv = null; AG.title = "新会话"; AG.msgs = [];
  agRender("float"); agRender("page"); agLoadConvs();
}

async function agOpenConv(id){
  AG.conv = id;
  const body = await api("/agent/conversations/messages/?conversation_id=" + id)
    .catch(e=>({}));
  AG.msgs = ((body.data && body.data.items) || []).map(m=>({
    role: m.role === "tool" ? "assistant" : m.role,
    content: m.role === "tool" ? "" : m.content,
    steps: m.role === "tool"
      ? [{name: m.name || "工具", text: "执行完成", done: true, ok: true}] : [],
  }));
  const conv = AG.convs.find(c=>c._id === id);
  AG.title = conv ? (conv.title || "新会话") : "新会话";
  agRender("float"); agRender("page"); agLoadConvs();
  if (window.gsap) gsap.fromTo("#ai-msgs-page", {opacity:0}, {opacity:1, duration:.25});
}

async function agDeleteConv(id){
  if (!confirm("删除该会话？")) return;
  await api("/agent/conversations/delete/", {method:"POST", json:{conversation_id: id}});
  if (AG.conv === id) agNew();
  else agLoadConvs();
}

async function agSend(view){
  const ta = $("#ai-input-" + view);
  if (!ta || AG.sending) return;
  const text = ta.value.trim();
  if (!text){ toast("请输入消息"); return; }
  ta.value = "";
  AG.msgs.push({role: "user", content: text});
  const botMsg = {role: "assistant", content: "", steps: []};
  AG.msgs.push(botMsg);
  AG.sending = true;
  agRender(view);

  try{
    const resp = await fetch(API + "/agent/chat", {
      method: "POST",
      headers: {"Token": token(), "Content-Type": "application/json"},
      body: JSON.stringify({message: text, conversation_id: AG.conv || ""}),
    });
    if (!resp.ok || !resp.body){ throw new Error("HTTP " + resp.status); }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0){
        const chunk = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 2);
        if (!chunk.startsWith("data: ")) continue;
        let ev;
        try { ev = JSON.parse(chunk.slice(6)); } catch(e){ continue; }
        if (ev.type === "start"){
          AG.conv = ev.conversation_id;
        } else if (ev.type === "delta"){
          botMsg.content += ev.text || "";
        } else if (ev.type === "tool"){
          botMsg.steps.push({name: ev.name, text: "调用中", done: false});
        } else if (ev.type === "tool_result"){
          const step = botMsg.steps.find(s=>s.name === ev.name && !s.done);
          if (step){ step.done = true; step.ok = ev.ok;
            step.text = ev.ok ? "完成" : "失败"; }
          if (!ev.ok) botMsg.content += "\n[工具 " + ev.name + " 失败]";
        } else if (ev.type === "error"){
          botMsg.content += "\n⚠ " + (ev.message || "出错");
        } else if (ev.type === "done"){
          agLoadConvs();
        }
        agRender(view);
      }
    }
  }catch(e){
    botMsg.content += "\n⚠ 连接失败: " + e.message;
  }
  AG.sending = false;
  agRender(view);
}

ROUTES.assistant = function(){
  $("#view").innerHTML = `
    <h2 class="page">智能助手</h2>
    <div style="display:flex;gap:14px;height:calc(100vh - 250px)">
      <div style="width:240px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;min-height:0">
        <button class="btn primary" onclick="agNew()">新建会话</button>
        <div class="tblwrap" style="flex:1;max-height:none;padding:6px" id="ag-conv-list">加载中…</div>
      </div>
      <div class="card" style="flex:1;display:flex;flex-direction:column;overflow:hidden;padding:0">
        <div class="ai-msgs" id="ai-msgs-page"></div>
        <div class="ai-input">
          <textarea id="ai-input-page" placeholder="布置任务，如：帮我看看 example.com 的风险并生成报告"
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();agSend('page')}"></textarea>
          <button class="btn primary" onclick="agSend('page')">发送</button>
        </div>
      </div>
    </div>`;
  agLoadConvs();
  agRender("page");
};

/* ============================ 会话池窗口登录（M3 网关） ============================ */
async function spOpenWindow(btn){
  const src = btn.dataset.src, acc = btn.dataset.acc;
  toast("正在打开浏览器窗口…");
  const body = await api("/session_pool/window/", {method:"POST",
    json:{source: src, account: acc}}).catch(e=>({message:String(e)}));
  if (body.code !== 200){ toast(body.message || "打开失败"); return; }
  const d = body.data || {};
  const host = location.hostname;
  $("#win-title").textContent = "窗口登录 · " + src + " / " + acc;
  $("#win-iframe").src = "http://" + host + ":" + d.ws_port +
    "/vnc.html?autoconnect=1&host=" + host + "&port=" + d.ws_port;
  $("#win-modal").dataset.src = src;
  $("#win-modal").dataset.acc = acc;
  $("#win-modal").style.display = "flex";
}

async function spCapture(){
  const m = $("#win-modal");
  const src = m.dataset.src, acc = m.dataset.acc;
  const btn = $("#win-capture-btn");
  btn.disabled = true; btn.textContent = "抓取中…";
  const body = await api("/session_pool/capture/", {method:"POST",
    json:{source: src, account: acc}}).catch(e=>({message:String(e)}));
  btn.disabled = false; btn.textContent = "完成并抓取";
  if (body.code !== 200){ toast(body.message || "抓取失败"); return; }
  const d = body.data || {};
  toast(d.ok ? "已抓取并探活通过（" + (d.cookie_names||[]).join(", ") + "）"
             : "已抓取，探活未通过：" + (d.detail || ""));
  m.style.display = "none";
  $("#win-iframe").src = "about:blank";
  if (location.hash.indexOf("sessions") >= 0) loadSessions();
}

function spCloseWindow(){
  const m = $("#win-modal");
  const src = m.dataset.src, acc = m.dataset.acc;
  m.style.display = "none";
  $("#win-iframe").src = "about:blank";
  if (src && acc) api("/session_pool/window/close/", {method:"POST",
    json:{source: src, account: acc}}).then(()=>{ if (location.hash.indexOf("sessions") >= 0) loadSessions(); });
}

/* ============================ 启动 ============================ */
boot();
