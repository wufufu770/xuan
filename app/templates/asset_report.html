<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>资产报告</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f8fafb;
      --text: #182026;
      --muted: #65737e;
      --faint: #8b98a2;
      --border: #dfe5e8;
      --border-strong: #cbd4d9;
      --accent: #087f75;
      --accent-soft: #e4f4f1;
      --blue: #2f6fed;
      --blue-soft: #eaf0ff;
      --amber: #ad6800;
      --amber-soft: #fff3d6;
      --red: #c13535;
      --red-soft: #fdecec;
      --green: #1f7a4d;
      --green-soft: #e7f5ed;
      --purple: #7253a6;
      --purple-soft: #f0ebf8;
      --shadow: 0 1px 2px rgba(24,32,38,.04), 0 8px 24px rgba(24,32,38,.05);
      --sidebar: 238px;
      --radius: 7px;
    }
    [data-theme="dark"] {
      --bg: #101416;
      --surface: #171c1f;
      --surface-2: #1d2327;
      --text: #eef2f3;
      --muted: #aab5bb;
      --faint: #819097;
      --border: #2d363b;
      --border-strong: #3c484e;
      --accent: #48b8aa;
      --accent-soft: #163b37;
      --blue: #79a4ff;
      --blue-soft: #1d3157;
      --amber: #e9ad4c;
      --amber-soft: #463619;
      --red: #f07b7b;
      --red-soft: #4a2525;
      --green: #6dcc98;
      --green-soft: #183d2b;
      --purple: #b89add;
      --purple-soft: #332746;
      --shadow: 0 1px 2px rgba(0,0,0,.18), 0 10px 28px rgba(0,0,0,.18);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      letter-spacing: 0;
    }
    button, input, select { font: inherit; letter-spacing: 0; }
    button, a, select { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 28%, transparent); outline-offset: 2px; }
    .icon { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .icon-sm { width: 14px; height: 14px; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 30;
      width: var(--sidebar); padding: 20px 14px 16px;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 8px 20px; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 7px; background: var(--accent); color: white; }
    .brand-mark .icon { width: 20px; height: 20px; }
    .brand-title { font-size: 15px; font-weight: 700; }
    .brand-sub { color: var(--muted); font-size: 12px; margin-top: 1px; }
    .nav-label { color: var(--faint); font-size: 11px; font-weight: 700; padding: 10px 10px 6px; }
    .nav { overflow: auto; min-height: 0; padding-right: 2px; }
    .nav-item {
      width: 100%; min-height: 38px; padding: 0 10px; margin: 2px 0; border: 0; border-radius: 6px;
      background: transparent; color: var(--muted); display: flex; align-items: center; gap: 10px; text-align: left;
      transition: background .16s ease, color .16s ease;
    }
    .nav-item:hover { color: var(--text); background: var(--surface-2); }
    .nav-item.active { color: var(--accent); background: var(--accent-soft); font-weight: 650; }
    .nav-count { margin-left: auto; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
    .nav-item.active .nav-count { color: var(--accent); }
    .sidebar-foot { margin-top: auto; border-top: 1px solid var(--border); padding: 13px 9px 0; color: var(--muted); font-size: 11px; }
    .sidebar-foot strong { display: block; color: var(--text); font-size: 12px; margin-bottom: 3px; }
    .shell { margin-left: var(--sidebar); min-height: 100vh; }
    .topbar {
      height: 68px; position: sticky; top: 0; z-index: 20; padding: 0 28px;
      display: flex; align-items: center; gap: 18px; background: color-mix(in srgb, var(--surface) 92%, transparent);
      border-bottom: 1px solid var(--border); backdrop-filter: blur(12px);
    }
    .mobile-menu.btn { display: none; }
    .page-title { min-width: 0; }
    .page-title h1 { font-size: 17px; line-height: 1.25; margin: 0; font-weight: 700; }
    .page-title p { margin: 3px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-actions { margin-left: auto; display: flex; gap: 8px; }
    .btn {
      min-height: 36px; border: 1px solid var(--border-strong); border-radius: 6px; padding: 0 12px;
      background: var(--surface); color: var(--text); display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      transition: border-color .16s ease, background .16s ease;
    }
    .btn:hover { border-color: var(--accent); background: var(--surface-2); }
    .btn.icon-only { width: 36px; padding: 0; }
    .btn.primary { color: white; background: var(--accent); border-color: var(--accent); }
    .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, black); }
    main { padding: 24px 28px 40px; max-width: 1680px; margin: 0 auto; }
    .view { display: none; }
    .view.active { display: block; animation: fade .18s ease; }
    @keyframes fade { from { opacity: .65; } to { opacity: 1; } }
    .overview-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .overview-head h2, .dataset-head h2 { margin: 0; font-size: 20px; font-weight: 700; }
    .overview-head p, .dataset-head p { margin: 5px 0 0; color: var(--muted); }
    .status-line { display: flex; align-items: center; gap: 8px; color: var(--muted); white-space: nowrap; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px var(--green-soft); }
    .kpi-grid { display: grid; grid-template-columns: repeat(6, minmax(130px, 1fr)); gap: 10px; }
    .kpi {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 15px;
      min-width: 0; box-shadow: 0 1px 1px rgba(24,32,38,.02);
    }
    .kpi-label { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .kpi-label .icon { color: var(--accent); }
    .kpi-value { margin-top: 8px; font-size: 24px; line-height: 1; font-weight: 720; font-variant-numeric: tabular-nums; }
    .kpi-note { margin-top: 7px; color: var(--faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .section-title { font-size: 13px; font-weight: 700; margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
    .dashboard-grid { display: grid; grid-template-columns: 1.15fr .85fr 1fr; gap: 12px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; min-width: 0; }
    .panel.span-2 { grid-column: span 2; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .panel-head h3 { margin: 0; font-size: 13px; font-weight: 700; }
    .panel-head span { color: var(--muted); font-size: 11px; }
    .chart-wrap { height: 224px; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }
    .mini-list { display: grid; gap: 10px; }
    .mini-row { display: grid; grid-template-columns: minmax(80px, 128px) 1fr auto; align-items: center; gap: 10px; min-width: 0; }
    .mini-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
    .mini-bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
    .mini-bar i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
    .mini-value { font-size: 12px; font-variant-numeric: tabular-nums; }
    .finding-list { display: grid; gap: 1px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .finding { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; padding: 11px 12px; background: var(--surface); }
    .finding + .finding { border-top: 1px solid var(--border); }
    .finding-icon { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); }
    .finding-title { font-size: 12px; font-weight: 650; }
    .finding-copy { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .dataset-head { display: flex; align-items: flex-start; gap: 18px; margin-bottom: 17px; }
    .dataset-head-copy { min-width: 0; }
    .dataset-badge { margin-left: auto; flex: 0 0 auto; padding: 4px 9px; border-radius: 4px; color: var(--accent); background: var(--accent-soft); font-size: 12px; font-weight: 650; }
    .notice { display: none; align-items: flex-start; gap: 9px; color: var(--blue); background: var(--blue-soft); border: 1px solid color-mix(in srgb, var(--blue) 25%, transparent); padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; }
    .notice.show { display: flex; }
    .table-shell { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-height: 58px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .search-box { position: relative; flex: 1 1 300px; max-width: 440px; }
    .search-box .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
    .control {
      height: 36px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--text); padding: 0 10px;
    }
    .search-box input { width: 100%; padding-left: 36px; }
    .control::placeholder { color: var(--faint); }
    select.control { min-width: 122px; }
    .toolbar-spacer { flex: 1 1 10px; }
    .result-count { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .table-scroll { overflow: auto; min-height: 240px; max-height: calc(100vh - 280px); }
    table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 940px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
    th {
      position: sticky; top: 0; z-index: 2; background: var(--surface-2); color: var(--muted); font-size: 11px; font-weight: 700;
      white-space: nowrap; user-select: none;
    }
    th.sortable { cursor: pointer; }
    th.sortable:hover { color: var(--text); }
    .sort-mark { margin-left: 5px; color: var(--faint); }
    td { font-size: 12px; max-width: 320px; }
    tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 36%, var(--surface)); }
    tbody tr:last-child td { border-bottom: 0; }
    .cell-text { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cell-link { color: var(--blue); text-decoration: none; }
    .cell-link:hover { text-decoration: underline; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-variant-numeric: tabular-nums; }
    .tag-list { display: flex; gap: 4px; max-width: 260px; overflow: hidden; }
    .tag { display: inline-flex; align-items: center; min-height: 22px; padding: 1px 6px; border-radius: 4px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); white-space: nowrap; font-size: 10px; }
    .badge { display: inline-flex; align-items: center; min-height: 22px; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .badge.green { color: var(--green); background: var(--green-soft); }
    .badge.amber { color: var(--amber); background: var(--amber-soft); }
    .badge.red { color: var(--red); background: var(--red-soft); }
    .badge.blue { color: var(--blue); background: var(--blue-soft); }
    .badge.purple { color: var(--purple); background: var(--purple-soft); }
    .badge.neutral { color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); }
    .detail-btn { min-width: 30px; min-height: 30px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: var(--muted); display: grid; place-items: center; }
    .detail-btn:hover { background: var(--surface-2); color: var(--text); }
    .empty { padding: 48px 20px; text-align: center; color: var(--muted); }
    .pager { min-height: 55px; padding: 9px 12px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .pager-info { color: var(--muted); font-size: 12px; }
    .pager-actions { margin-left: auto; display: flex; gap: 5px; align-items: center; }
    .page-btn { min-width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface); color: var(--text); }
    .page-btn:hover:not(:disabled) { border-color: var(--accent); }
    .page-btn:disabled { color: var(--faint); cursor: default; opacity: .55; }
    .page-current { min-width: 64px; text-align: center; color: var(--muted); font-size: 12px; }
    .drawer-scrim { position: fixed; inset: 0; z-index: 60; display: none; background: rgba(9,14,17,.46); }
    .drawer-scrim.open { display: block; }
    .drawer {
      position: absolute; inset: 0 0 0 auto; width: min(560px, 92vw); padding: 20px; background: var(--surface); box-shadow: -20px 0 50px rgba(0,0,0,.15); overflow: auto;
    }
    .drawer-head { display: flex; align-items: center; gap: 12px; position: sticky; top: -20px; background: var(--surface); padding: 5px 0 15px; border-bottom: 1px solid var(--border); z-index: 2; }
    .drawer-head h3 { margin: 0; font-size: 16px; }
    .drawer-close { margin-left: auto; }
    .detail-grid { margin-top: 16px; display: grid; gap: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .detail-row { display: grid; grid-template-columns: 135px 1fr; min-width: 0; }
    .detail-row + .detail-row { border-top: 1px solid var(--border); }
    .detail-key { padding: 10px 12px; color: var(--muted); background: var(--surface-2); font-size: 11px; }
    .detail-value { padding: 10px 12px; word-break: break-all; white-space: pre-wrap; font-size: 12px; }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 90; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 9px 13px; border-radius: 6px; background: #182026; color: white; font-size: 12px; transition: .2s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 1280px) {
      .kpi-grid { grid-template-columns: repeat(4, minmax(130px, 1fr)); }
      .dashboard-grid { grid-template-columns: 1fr 1fr; }
      .panel.span-2 { grid-column: span 1; }
    }
    @media (max-width: 900px) {
      .sidebar { transform: translateX(-100%); transition: transform .2s ease; box-shadow: 20px 0 40px rgba(0,0,0,.14); }
      body.menu-open .sidebar { transform: translateX(0); }
      .shell { margin-left: 0; }
      .mobile-menu.btn { display: inline-flex; }
      .topbar { padding: 0 16px; }
      main { padding: 18px 16px 32px; }
      .kpi-grid { grid-template-columns: repeat(3, minmax(110px, 1fr)); }
    }
    @media (max-width: 620px) {
      .topbar { height: 60px; gap: 10px; }
      .page-title p { display: none; }
      .top-actions .btn span { display: none; }
      .overview-head { align-items: flex-start; flex-direction: column; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .kpi { padding: 12px; }
      .kpi-value { font-size: 21px; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .panel { padding: 14px; }
      .dataset-head { flex-wrap: wrap; }
      .dataset-badge { margin-left: 0; }
      .toolbar { align-items: stretch; }
      .search-box { max-width: none; flex-basis: 100%; }
      select.control { flex: 1 1 130px; min-width: 0; }
      .toolbar-spacer { display: none; }
      .result-count { width: 100%; }
      .pager-info { display: none; }
      .pager-actions { margin-left: 0; width: 100%; justify-content: space-between; }
      .detail-row { grid-template-columns: 105px 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; } }
    @media print {
      .sidebar, .topbar, .toolbar, .pager, .drawer-scrim, .toast { display: none !important; }
      .shell { margin: 0; }
      main { max-width: none; padding: 0; }
      body { background: white; color: #111; }
      .view { display: none !important; }
      #overview-view { display: block !important; }
      .panel, .kpi { break-inside: avoid; box-shadow: none; }
    }
  </style>
</head>
<body>

  <aside class="sidebar" aria-label="报告导航">
    <div class="brand">
      <div class="brand-mark"><svg class="icon"><use href="#i-radar"/></svg></div>
      <div><div class="brand-title">资产分析报告</div><div class="brand-sub" id="brand-target">加载中</div></div>
    </div>
    <div class="nav-label">报告视图</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot"><strong id="side-project">项目</strong><span id="side-generated">生成时间</span></div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <button class="btn icon-only mobile-menu" id="menu-btn" aria-label="打开导航"><svg class="icon"><use href="#i-menu"/></svg></button>
      <div class="page-title"><h1 id="header-title">资产概览</h1><p id="header-subtitle">离线资产报告</p></div>
      <div class="top-actions">
        <button class="btn icon-only" id="theme-btn" aria-label="切换主题" title="切换主题"><svg class="icon"><use href="#i-moon"/></svg></button>
        <button class="btn" id="print-btn"><svg class="icon"><use href="#i-print"/></svg><span>打印 / PDF</span></button>
      </div>
    </header>
    <main>
      <section class="view active" id="overview-view">
        <div class="overview-head">
          <div><h2 id="report-target">资产概览</h2><p id="report-period"></p></div>
          <div class="status-line"><i class="status-dot"></i><span id="report-status">任务已完成</span></div>
        </div>
        <div class="kpi-grid" id="kpi-grid"></div>
        <div class="section-title"><svg class="icon"><use href="#i-activity"/></svg>资产画像</div>
        <div class="dashboard-grid">
          <article class="panel"><div class="panel-head"><h3>站点状态分布</h3><span>HTTP 响应</span></div><div class="chart-wrap"><canvas id="status-chart" aria-label="站点状态分布图"></canvas></div></article>
          <article class="panel"><div class="panel-head"><h3>资产构成</h3><span>核心集合</span></div><div class="chart-wrap"><canvas id="asset-chart" aria-label="资产构成图"></canvas></div></article>
          <article class="panel"><div class="panel-head"><h3>技术指纹</h3><span>Top 8</span></div><div class="mini-list" id="fingerprint-list"></div></article>
          <article class="panel"><div class="panel-head"><h3>IP 地域</h3><span>归属分布</span></div><div class="mini-list" id="country-list"></div></article>
          <article class="panel"><div class="panel-head"><h3>开放端口</h3><span>Top 10</span></div><div class="mini-list" id="port-list"></div></article>
          <article class="panel"><div class="panel-head"><h3>目录结果类型</h3><span>结果构成</span></div><div class="mini-list" id="path-type-list"></div></article>
        </div>
        <div class="section-title"><svg class="icon"><use href="#i-info"/></svg>本次结果摘要</div>
        <div class="finding-list" id="finding-list"></div>
      </section>
      <section class="view" id="dataset-view">
        <div class="dataset-head">
          <div class="dataset-head-copy"><h2 id="dataset-title"></h2><p id="dataset-description"></p></div>
          <div class="dataset-badge" id="dataset-total">0 条</div>
        </div>
        <div class="notice" id="dataset-notice"><svg class="icon"><use href="#i-info"/></svg><span></span></div>
        <div class="table-shell">
          <div class="toolbar">
            <div class="search-box"><svg class="icon"><use href="#i-search"/></svg><input class="control" id="table-search" type="search" placeholder="搜索当前数据" aria-label="搜索当前数据"></div>
            <div id="filter-box" style="display:contents"></div>
            <div class="toolbar-spacer"></div>
            <span class="result-count" id="result-count"></span>
            <select class="control" id="page-size" aria-label="每页条数"><option>25</option><option selected>50</option><option>100</option></select>
            <button class="btn" id="csv-btn"><svg class="icon"><use href="#i-download"/></svg>CSV</button>
          </div>
          <div class="table-scroll"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div>
          <div class="pager"><span class="pager-info" id="pager-info"></span><div class="pager-actions"><button class="page-btn" id="first-btn" aria-label="第一页">«</button><button class="page-btn" id="prev-btn" aria-label="上一页">‹</button><span class="page-current" id="page-current"></span><button class="page-btn" id="next-btn" aria-label="下一页">›</button><button class="page-btn" id="last-btn" aria-label="最后一页">»</button></div></div>
        </div>
      </section>
    </main>
  </div>
  <div class="drawer-scrim" id="drawer-scrim" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <aside class="drawer"><div class="drawer-head"><h3 id="drawer-title">记录详情</h3><button class="btn icon-only drawer-close" id="drawer-close" aria-label="关闭详情"><svg class="icon"><use href="#i-x"/></svg></button></div><div class="detail-grid" id="detail-grid"></div></aside>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const REPORT = __REPORT_DATA__;
    const D = REPORT.datasets;
    const icon = name => `<svg class="icon"><use href="#i-${name}"/></svg>`;
    const nfmt = value => new Intl.NumberFormat('zh-CN').format(Number(value || 0));
    const compact = value => new Intl.NumberFormat('zh-CN', { notation: 'compact', maximumFractionDigits: 1 }).format(Number(value || 0));
    const configs = {
      overview: { title: '资产概览', icon: 'grid' },
      domains: { title: '域名资产', icon: 'globe', description: '已发现域名、解析记录、来源和 Host 候选状态。', columns: [
        ['domain','域名','mono'], ['type','记录类型','badge'], ['records','解析记录','array'], ['sources','来源','array'], ['family','候选族','text'], ['resolve_status','解析状态','badge'], ['host_dns_status','Host 状态','badge']
      ], filters: ['type','resolve_status','host_dns_status'] },
      ips: { title: 'IP 与端口', icon: 'server', description: '公网地址、关联域名、开放端口、服务和网络归属。', columns: [
        ['ip','IP 地址','mono'], ['type','类型','badge'], ['domains','关联域名','array'], ['ports','端口','array'], ['services','服务','array'], ['country','国家/地区','text'], ['organization','组织','text']
      ], filters: ['type','country'] },
      sites: { title: '站点资产', icon: 'monitor', description: '可访问 Web 端点、浏览器补采标题、SPA/SSO 运行时证据和扫描策略。', columns: [
        ['site','站点','url'], ['status','状态码','status'], ['title','标题','text'], ['runtime','动态类型','badge'], ['ip','IP','mono'], ['tech','技术栈','array'], ['policy','扫描策略','badge'], ['waf','WAF','badge'], ['level','置信度','badge']
      ], filters: ['status','runtime','policy','waf'] },
      certs: { title: '证书资产', icon: 'shield', description: '目标端点证书、主体、签发方、有效期和 SAN 关系。', columns: [
        ['ip','IP','mono'], ['port','端口','mono'], ['common_name','通用名称','mono'], ['organization','组织','text'], ['issuer','签发方','text'], ['valid_to','有效期至','text'], ['expired','过期','boolean'], ['san_count','SAN 数','number'], ['relation','归属关系','badge']
      ], filters: ['expired','relation'] },
      entries: { title: '入口资产', icon: 'signpost', description: '由页面、脚本和情报证据反馈的新域名或入口种子。', columns: [
        ['seed','资产种子','mono'], ['type','类型','badge'], ['status','处理状态','badge'], ['source','来源','badge'], ['collectors','采集器','array'], ['is_new','净新增','boolean'], ['reprobe','重新探活','boolean'], ['reprobe_reason','重探原因','text']
      ], filters: ['type','status','source'] },
      paths: { title: '目录与路径', icon: 'folder', description: '目录扫描命中、跳转线索、受保护入口和资源线索。', columns: [
        ['url','URL','url'], ['status','状态码','status'], ['type','结果类型','badge'], ['title','标题','text'], ['redirect','跳转目标','url'], ['redirect_system','目标系统','text'], ['verified','验证状态','badge'], ['reason','判定依据','text']
      ], filters: ['status','type','verified'] },
      urls: { title: 'URL 信息', icon: 'link', description: '爬虫确认的页面、接口及脚本入口 URL。', columns: [
        ['url','URL','url'], ['status','状态码','status'], ['title','标题','text'], ['type','类型','badge'], ['source','来源','badge'], ['collector','采集器','badge'], ['from','发现位置','url']
      ], filters: ['status','type','collector'] },
      intelligence: { title: 'WIH 情报', icon: 'spark', description: '页面和脚本中提取的绝对 URL、域名及敏感线索。', columns: [
        ['content','内容','url'], ['type','类型','badge'], ['site','证据页面','url'], ['url_site','目标站点','url'], ['source','来源','badge'], ['collector','采集器','badge'], ['evidence','证据类型','badge']
      ], filters: ['type','source','collector'] },
      host_collisions: { title: 'Host 碰撞', icon: 'network', description: 'IP 与 Host 的有效映射结果，用于源站和虚拟主机资产扩展。', notice: '本模块属于资产映射，不计入风险统计；默认只展示稳定 200 的确认映射，非 200 响应仅保留为原始待确认证据。', columns: [
        ['ip','IP','mono'], ['port','端口','mono'], ['scheme','协议','badge'], ['domain','Host','mono'], ['status','状态码','status'], ['title','标题','text'], ['length','响应长度','number'], ['confidence','置信类型','badge'], ['reason','候选原因','text'], ['historical','历史端点','boolean']
      ], filters: ['status','confidence','scheme','historical'] },
      cidrs: { title: '网络段', icon: 'route', description: '按网段聚合的域名和 IP 关系，用于归属分析。', columns: [
        ['cidr','CIDR','mono'], ['domain_count','域名数','number'], ['ip_count','IP 数','number'], ['domains','域名','array'], ['ips','IP','array']
      ] },
      fingerprints: { title: '技术指纹', icon: 'filter', description: '站点技术栈和组件指纹聚合。', columns: [
        ['name','指纹名称','text'], ['count','命中数','number']
      ] }
    };
    const state = { view: 'overview', rows: [], filtered: [], query: '', filters: {}, sortKey: '', sortDir: 1, page: 1, size: 50 };

    function init() {
      document.title = REPORT.meta.title || `${REPORT.meta.target} 资产报告`;
      document.getElementById('brand-target').textContent = REPORT.meta.title || REPORT.meta.target;
      document.getElementById('side-project').textContent = `项目：${REPORT.meta.project || '-'}`;
      document.getElementById('side-generated').textContent = `生成于 ${REPORT.meta.generated_at}`;
      document.getElementById('header-subtitle').textContent = REPORT.meta.scope_detail || `${REPORT.meta.target} · ${REPORT.meta.task_id}`;
      document.getElementById('report-target').textContent = REPORT.meta.title || `${REPORT.meta.target} 资产报告`;
      document.getElementById('report-period').textContent = `${REPORT.meta.start_time} 至 ${REPORT.meta.end_time}`;
      document.getElementById('report-status').textContent = REPORT.meta.scope_type === 'task'
        ? (REPORT.meta.status === 'done' ? '任务已完成' : `任务状态：${REPORT.meta.status}`)
        : `${REPORT.meta.task_count || 0} 个任务已汇总`;
      buildNav(); buildOverview(); bindEvents();
      const savedTheme = localStorage.getItem('asset-report-theme');
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    }

    function buildNav() {
      const nav = document.getElementById('nav');
      nav.innerHTML = Object.entries(configs).map(([key, cfg]) => {
        const count = key === 'overview' ? '' : `<span class="nav-count">${compact((D[key] || []).length)}</span>`;
        return `<button class="nav-item ${key === 'overview' ? 'active' : ''}" data-view="${key}">${icon(cfg.icon)}<span>${cfg.title}</span>${count}</button>`;
      }).join('');
    }

    function buildOverview() {
      const cards = [
        ['domains','域名','globe','已解析及候选资产'], ['ips','IP','server','公网与关联地址'], ['sites','站点','monitor','可访问 Web 端点'],
        ['certs','证书','shield','已验证端点证书'], ['entries','入口','signpost','反馈资产种子'], ['paths','目录路径','folder','入口与资源线索'],
        ['urls','URL','link','确认页面与接口'], ['intelligence','WIH 情报','spark',`${REPORT.summary.sensitive} 条敏感线索`],
        ['host_collisions','Host 映射','network','独立资产映射'], ['cidrs','网络段','route','网段归属聚合'], ['fingerprints','技术指纹','filter','组件类型']
      ];
      document.getElementById('kpi-grid').innerHTML = cards.map(([key,label,ic,note]) => `<article class="kpi"><div class="kpi-label">${icon(ic)}${label}</div><div class="kpi-value">${nfmt((D[key] || []).length)}</div><div class="kpi-note">${note}</div></article>`).join('');
      drawCharts();
      fillMiniList('fingerprint-list', D.fingerprints.slice(0,8).map(x => [x.name,x.count]), 'accent');
      fillMiniList('country-list', topEntries(REPORT.distributions.countries,8), 'blue');
      fillMiniList('port-list', topEntries(REPORT.distributions.ports,10), 'purple');
      fillMiniList('path-type-list', topEntries(REPORT.distributions.path_types,8), 'amber');
      const host200 = REPORT.distributions.host_status['200'] || 0;
      const site200 = REPORT.distributions.site_status['200'] || 0;
      const notices = [
        ['globe', `${nfmt(REPORT.summary.domains)} 个域名进入资产视图`, `覆盖 ${nfmt(REPORT.summary.ips)} 个 IP，${nfmt(REPORT.summary.sites)} 个 Web 站点。`, '域名资产'],
        ['monitor', `${nfmt(site200)} 个站点返回 200`, `补采 ${nfmt(REPORT.summary.browser_titles || 0)} 个浏览器标题，识别 ${nfmt(REPORT.summary.runtime_spa || 0)} 个 SPA 和 ${nfmt(REPORT.summary.runtime_sso || 0)} 条 SSO 跳转链。`, '站点资产'],
        ['spark', `${nfmt(REPORT.summary.intelligence)} 条页面情报`, `包含 ${nfmt(REPORT.summary.sensitive)} 条敏感线索和 ${nfmt(REPORT.summary.entries)} 个入口反馈。`, 'WIH 情报'],
        ['network', `${nfmt(REPORT.summary.host_collisions)} 条 Host 映射`, `${nfmt(host200)} 条返回 200；该模块用于资产扩展，不计入风险。`, 'Host 碰撞']
      ];
      document.getElementById('finding-list').innerHTML = notices.map(([ic,title,copy,view]) => `<div class="finding"><span class="finding-icon">${icon(ic)}</span><div><div class="finding-title">${title}</div><div class="finding-copy">${copy}</div></div><span class="badge neutral">${view}</span></div>`).join('');
    }

    function drawCharts() {
      drawDonut(document.getElementById('status-chart'), REPORT.distributions.site_status, ['#1f7a4d','#ad6800','#7b8790','#2f6fed','#c13535','#7253a6','#087f75','#9c5d34']);
      drawBars(document.getElementById('asset-chart'), {域名:REPORT.summary.domains,IP:REPORT.summary.ips,站点:REPORT.summary.sites,路径:REPORT.summary.paths,入口:REPORT.summary.entries,证书:REPORT.summary.certs});
    }

    function canvasSetup(canvas) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2); const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, rect.width*dpr); canvas.height = Math.max(1, rect.height*dpr);
      const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr); return [ctx,rect.width,rect.height];
    }
    function drawDonut(canvas, data, colors) {
      const [ctx,w,h] = canvasSetup(canvas); const rows = topEntries(data,8); const total = rows.reduce((s,x)=>s+x[1],0) || 1;
      const cx = Math.min(w*.32,96), cy = h/2, r = Math.min(72,h*.34), inner = r*.62; let start=-Math.PI/2;
      rows.forEach(([_,value],i)=>{ const end=start+(value/total)*Math.PI*2; ctx.beginPath(); ctx.arc(cx,cy,r,start,end); ctx.arc(cx,cy,inner,end,start,true); ctx.closePath(); ctx.fillStyle=colors[i%colors.length]; ctx.fill(); start=end; });
      ctx.fillStyle=getCss('--text'); ctx.textAlign='center'; ctx.font='700 20px -apple-system, sans-serif'; ctx.fillText(nfmt(total),cx,cy+2); ctx.fillStyle=getCss('--muted'); ctx.font='11px -apple-system, sans-serif'; ctx.fillText('站点',cx,cy+20);
      const lx=Math.max(cx+r+28,w*.56), rowH=Math.min(25,h/rows.length); ctx.textAlign='left'; ctx.font='11px -apple-system, sans-serif';
      rows.forEach(([name,value],i)=>{ const y=(h-rows.length*rowH)/2+i*rowH+10; ctx.fillStyle=colors[i%colors.length]; ctx.fillRect(lx,y-8,8,8); ctx.fillStyle=getCss('--muted'); ctx.fillText(String(name),lx+14,y); ctx.textAlign='right'; ctx.fillStyle=getCss('--text'); ctx.fillText(String(value),w-8,y); ctx.textAlign='left'; });
    }
    function drawBars(canvas, data) {
      const [ctx,w,h] = canvasSetup(canvas); const rows=Object.entries(data); const max=Math.max(...rows.map(x=>x[1]),1); const left=48,right=42,top=13,rowH=(h-26)/rows.length;
      ctx.font='11px -apple-system, sans-serif'; rows.forEach(([name,value],i)=>{ const y=top+i*rowH; ctx.fillStyle=getCss('--muted'); ctx.textAlign='right'; ctx.fillText(name,left-9,y+rowH*.58); ctx.fillStyle=getCss('--surface-2'); roundRect(ctx,left,y+rowH*.27,w-left-right,rowH*.34,3); ctx.fill(); ctx.fillStyle=i%2?getCss('--blue'):getCss('--accent'); roundRect(ctx,left,y+rowH*.27,(w-left-right)*(value/max),rowH*.34,3); ctx.fill(); ctx.fillStyle=getCss('--text'); ctx.textAlign='right'; ctx.fillText(nfmt(value),w-5,y+rowH*.58); });
    }
    function roundRect(ctx,x,y,w,h,r){ const rr=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath(); }
    function getCss(token){ return getComputedStyle(document.documentElement).getPropertyValue(token).trim(); }
    function topEntries(obj,limit=8){ return Object.entries(obj||{}).sort((a,b)=>Number(b[1])-Number(a[1])).slice(0,limit); }
    function fillMiniList(id, rows, color='accent', suffix='') {
      const max=Math.max(...rows.map(x=>Number(x[1])),1); const token={accent:'--accent',blue:'--blue',purple:'--purple',amber:'--amber'}[color];
      document.getElementById(id).innerHTML=rows.map(([name,value])=>`<div class="mini-row"><span class="mini-name" title="${esc(name)}">${esc(name)}</span><span class="mini-bar"><i style="width:${Math.max(3,Number(value)/max*100)}%;background:var(${token})"></i></span><span class="mini-value">${nfmt(value)}${suffix}</span></div>`).join('');
    }

    function switchView(view) {
      state.view=view; document.body.classList.remove('menu-open');
      document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.view===view));
      const overview=view==='overview'; document.getElementById('overview-view').classList.toggle('active',overview); document.getElementById('dataset-view').classList.toggle('active',!overview);
      document.getElementById('header-title').textContent=configs[view].title;
      if (!overview) loadDataset(view);
      window.scrollTo({top:0,behavior:'instant'});
    }

    function loadDataset(key) {
      const cfg=configs[key]; state.rows=D[key]||[]; state.query=''; state.filters={}; state.sortKey=''; state.sortDir=1; state.page=1;
      document.getElementById('dataset-title').textContent=cfg.title; document.getElementById('dataset-description').textContent=cfg.description;
      document.getElementById('dataset-total').textContent=`${nfmt(state.rows.length)} 条`;
      const notice=document.getElementById('dataset-notice'); notice.classList.toggle('show',!!cfg.notice); notice.querySelector('span').textContent=cfg.notice||'';
      document.getElementById('table-search').value=''; buildFilters(cfg); applyTable();
    }
    function buildFilters(cfg) {
      const box=document.getElementById('filter-box'); box.innerHTML=(cfg.filters||[]).map(key=>{
        const col=cfg.columns.find(x=>x[0]===key); const values=[...new Set(state.rows.map(r=>displayPrimitive(r[key])).filter(Boolean))].sort((a,b)=>naturalCompare(a,b)).slice(0,200);
        return `<select class="control filter-select" data-key="${key}" aria-label="筛选${esc(col?.[1]||key)}"><option value="">${esc(col?.[1]||key)}：全部</option>${values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select>`;
      }).join('');
    }
    function applyTable() {
      const q=state.query.trim().toLowerCase();
      state.filtered=state.rows.filter(row=>{
        if(q&&!Object.values(row).some(v=>valueText(v).toLowerCase().includes(q))) return false;
        return Object.entries(state.filters).every(([key,val])=>!val||displayPrimitive(row[key])===val);
      });
      if(state.sortKey) state.filtered.sort((a,b)=>state.sortDir*compareValues(a[state.sortKey],b[state.sortKey]));
      const pages=Math.max(1,Math.ceil(state.filtered.length/state.size)); state.page=Math.min(state.page,pages); renderTable();
    }
    function renderTable() {
      const cfg=configs[state.view]; const cols=cfg.columns; const start=(state.page-1)*state.size; const pageRows=state.filtered.slice(start,start+state.size);
      document.getElementById('table-head').innerHTML=`<tr>${cols.map(([key,label])=>`<th class="sortable" data-sort="${key}">${esc(label)}<span class="sort-mark">${state.sortKey===key?(state.sortDir===1?'↑':'↓'):'↕'}</span></th>`).join('')}<th>详情</th></tr>`;
      const body=document.getElementById('table-body');
      body.innerHTML=pageRows.length?pageRows.map((row,idx)=>`<tr>${cols.map(([key,_,type])=>`<td>${formatCell(row[key],type)}</td>`).join('')}<td><button class="detail-btn" data-row="${start+idx}" aria-label="查看详情" title="查看详情">${icon('eye')}</button></td></tr>`).join(''):`<tr><td colspan="${cols.length+1}"><div class="empty">没有符合当前条件的数据</div></td></tr>`;
      const end=Math.min(start+state.size,state.filtered.length); const pages=Math.max(1,Math.ceil(state.filtered.length/state.size));
      document.getElementById('result-count').textContent=`筛选后 ${nfmt(state.filtered.length)} 条`;
      document.getElementById('pager-info').textContent=state.filtered.length?`显示 ${nfmt(start+1)}–${nfmt(end)}，共 ${nfmt(state.filtered.length)} 条`:'共 0 条';
      document.getElementById('page-current').textContent=`${state.page} / ${pages}`;
      document.getElementById('first-btn').disabled=document.getElementById('prev-btn').disabled=state.page<=1;
      document.getElementById('last-btn').disabled=document.getElementById('next-btn').disabled=state.page>=pages;
    }

    function formatCell(value,type) {
      if(value===null||value===undefined||value==='') return '<span class="cell-text" style="color:var(--faint)">—</span>';
      if(type==='array') { const arr=Array.isArray(value)?value:[value]; const shown=arr.slice(0,3); return `<span class="tag-list">${shown.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}${arr.length>3?`<span class="tag">+${arr.length-3}</span>`:''}</span>`; }
      if(type==='url') { const text=String(value); const href=/^https?:\/\//i.test(text)?text:''; return href?`<a class="cell-text cell-link" href="${esc(href)}" target="_blank" rel="noreferrer" title="${esc(text)}">${esc(text)}</a>`:`<span class="cell-text" title="${esc(text)}">${esc(text)}</span>`; }
      if(type==='status') return `<span class="badge ${statusClass(value)}">${esc(value)}</span>`;
      if(type==='badge') return `<span class="badge ${badgeClass(value)}">${esc(displayPrimitive(value))}</span>`;
      if(type==='boolean') return `<span class="badge ${value?'green':'neutral'}">${value?'是':'否'}</span>`;
      if(type==='number') return `<span class="cell-text mono">${nfmt(value)}</span>`;
      if(type==='mono') return `<span class="cell-text mono" title="${esc(value)}">${esc(value)}</span>`;
      return `<span class="cell-text" title="${esc(value)}">${esc(value)}</span>`;
    }
    function statusClass(v){ const n=Number(v); if(n>=200&&n<300)return'green'; if(n>=300&&n<400)return'blue'; if(n===401||n===403)return'amber'; if(n>=500)return'red'; return'neutral'; }
    function badgeClass(v){ const s=String(v).toLowerCase(); if(/done|alive|resolved|verified|active|high|strict_200|public/.test(s))return'green'; if(/warning|partial|limited|protected|auth|pending/.test(s))return'amber'; if(/error|dead|expired|failed|unresolved/.test(s))return'red'; if(/redirect|duplicate|probe/.test(s))return'blue'; if(/sensitive|password|secret|key/.test(s))return'purple'; return'neutral'; }
    function displayPrimitive(v){ if(Array.isArray(v))return v.join(', '); if(typeof v==='boolean')return v?'是':'否'; if(v&&typeof v==='object')return JSON.stringify(v); return v===null||v===undefined?'':String(v); }
    function valueText(v){ return displayPrimitive(v); }
    function compareValues(a,b){ const an=Number(a),bn=Number(b); if(a!==''&&b!==''&&Number.isFinite(an)&&Number.isFinite(bn))return an-bn; return naturalCompare(valueText(a),valueText(b)); }
    function naturalCompare(a,b){ return String(a).localeCompare(String(b),'zh-CN',{numeric:true,sensitivity:'base'}); }
    function esc(v){ return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function showDetails(index) {
      const row=state.filtered[index]; if(!row)return;
      document.getElementById('detail-grid').innerHTML=Object.entries(row).map(([key,value])=>`<div class="detail-row"><div class="detail-key">${esc(key)}</div><div class="detail-value">${esc(Array.isArray(value)?value.join('\n'):typeof value==='object'?JSON.stringify(value,null,2):displayPrimitive(value))||'—'}</div></div>`).join('');
      document.getElementById('drawer-scrim').classList.add('open'); document.getElementById('drawer-close').focus();
    }
    function closeDrawer(){ document.getElementById('drawer-scrim').classList.remove('open'); }
    function exportCsv() {
      const cfg=configs[state.view]; const cols=cfg.columns; const rows=[cols.map(x=>x[1]),...state.filtered.map(r=>cols.map(c=>valueText(r[c[0]])))];
      const csv='\ufeff'+rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n'); const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`${REPORT.meta.target}-${configs[state.view].title}.csv`; a.click(); URL.revokeObjectURL(url); toast(`已导出 ${nfmt(state.filtered.length)} 条数据`);
    }
    function toast(text){ const el=document.getElementById('toast'); el.textContent=text; el.classList.add('show'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.classList.remove('show'),1800); }
    function bindEvents() {
      document.getElementById('nav').addEventListener('click',e=>{ const btn=e.target.closest('.nav-item'); if(btn)switchView(btn.dataset.view); });
      document.getElementById('menu-btn').addEventListener('click',()=>document.body.classList.toggle('menu-open'));
      document.addEventListener('click',e=>{ if(document.body.classList.contains('menu-open')&&!e.target.closest('.sidebar')&&!e.target.closest('#menu-btn'))document.body.classList.remove('menu-open'); });
      document.getElementById('table-search').addEventListener('input',e=>{ state.query=e.target.value; state.page=1; applyTable(); });
      document.getElementById('filter-box').addEventListener('change',e=>{ if(e.target.matches('.filter-select')){state.filters[e.target.dataset.key]=e.target.value;state.page=1;applyTable();} });
      document.getElementById('page-size').addEventListener('change',e=>{state.size=Number(e.target.value);state.page=1;applyTable();});
      document.getElementById('table-head').addEventListener('click',e=>{const th=e.target.closest('[data-sort]');if(!th)return;const k=th.dataset.sort;if(state.sortKey===k)state.sortDir*=-1;else{state.sortKey=k;state.sortDir=1;}applyTable();});
      document.getElementById('table-body').addEventListener('click',e=>{const btn=e.target.closest('[data-row]');if(btn)showDetails(Number(btn.dataset.row));});
      document.getElementById('first-btn').addEventListener('click',()=>{state.page=1;renderTable();});
      document.getElementById('prev-btn').addEventListener('click',()=>{state.page=Math.max(1,state.page-1);renderTable();});
      document.getElementById('next-btn').addEventListener('click',()=>{state.page=Math.min(Math.ceil(state.filtered.length/state.size),state.page+1);renderTable();});
      document.getElementById('last-btn').addEventListener('click',()=>{state.page=Math.max(1,Math.ceil(state.filtered.length/state.size));renderTable();});
      document.getElementById('csv-btn').addEventListener('click',exportCsv); document.getElementById('print-btn').addEventListener('click',()=>window.print());
      document.getElementById('drawer-close').addEventListener('click',closeDrawer); document.getElementById('drawer-scrim').addEventListener('click',e=>{if(e.target.id==='drawer-scrim')closeDrawer();});
      document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
      document.getElementById('theme-btn').addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;localStorage.setItem('asset-report-theme',theme);requestAnimationFrame(drawCharts);});
      let resizeTimer; window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(drawCharts,120);});
    }
    init();
  </script>
</body>
</html>
